name: Site

# The website, built against the pinned engine (`trillion3d.commit`, `scripts/engine.ts`) into
# dist/site on every pull request and push to main, and published to the site's own server on a push
# to main or a manual run asked to deploy (README.md, "Deploy"). The audience tag only the published
# build adds is proved by `scripts/docs/measurement.test.ts`. The open world is published by its own
# repository, pasquelin/Trillion3D-openworld, under `openworld/`, which this deploy leaves alone.
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the built site (from main only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      deploy: ${{ steps.plan.outputs.deploy }}
    steps:
      - uses: actions/checkout@v7
      # The install's `prepare` checks the pinned engine out under `.engine/` and writes the API
      # files from its declarations.
      - uses: ./.github/actions/node
      # Whether this run publishes, decided once: only main is ever published.
      - id: plan
        env:
          DEPLOY: >-
            ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' ||
            (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}
        run: echo "deploy=$DEPLOY" >> "$GITHUB_OUTPUT"
      # A deploying run cooks the scene caches with the native compiler of the pinned engine, which
      # links the engine's pinned Jolt.
      - if: steps.plan.outputs.deploy == 'true'
        uses: dtolnay/rust-toolchain@stable
      - if: steps.plan.outputs.deploy == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .engine/packages/asset-compiler-rust
      - if: steps.plan.outputs.deploy == 'true'
        run: pnpm run build:native && pnpm run compile:caches
      # Styles, demo maths, browser engine, workers, portal, API files, scene caches and statics;
      # `--published` adds the audience measurement, which no pull request or local build carries.
      - if: steps.plan.outputs.deploy == 'true'
        run: node scripts/docs/build.ts --published
      - if: steps.plan.outputs.deploy != 'true'
        run: pnpm run build:docs
      # The floor of a sound output: the build copies every tracked served static of site/
      # (sources .ts/.tsx excluded) and writes index.html, robots.txt and the report.html redirect
      # beside them, so a tree holding fewer files than that lost part of the copy.
      - name: Refuse an empty or partial output
        run: |
          for file in index.html runtime/portal.js runtime/engine.js; do
            test -s "dist/site/$file" || { echo "::error::dist/site/$file is missing"; exit 1; }
          done
          statics=$(git ls-files -- site/examples site/assets site/data | grep -cEv '\.tsx?$')
          floor=$((statics + 3))
          count=$(find dist/site -type f | wc -l)
          echo "$count files, floor $floor"
          test "$count" -ge "$floor" || { echo "::error::$count files, fewer than $floor"; exit 1; }
      # The scene caches' objects, geometry pages among them, are the exception to the gzip below:
      # brotli takes 11 to 24 % off them. Sent beside each original with `Content-Encoding: br` to
      # a browser that accepts it; `isCacheObject` picks them, as the docs server does locally, and
      # the engine reads the decoded bytes its fingerprints check.
      - if: steps.plan.outputs.deploy == 'true'
        run: node scripts/compress-cache-objects.ts dist/site
      - if: steps.plan.outputs.deploy == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/site
          if-no-files-found: error
          retention-days: 1

  # Its own job: until the maintainer adds the DEPLOY_* secrets, it fails with a message and the
  # build above stays green.
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # One deployment at a time, and never one cut off halfway through its transfer.
    concurrency:
      group: site
      cancel-in-progress: false
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_TARGET: ${{ secrets.DEPLOY_TARGET }}
      DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
    steps:
      - name: Require the deploy secrets
        run: |
          missing=""
          for name in DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS DEPLOY_TARGET DEPLOY_SSH_PORT; do
            test -n "${!name}" || missing="$missing $name"
          done
          test -z "$missing" || { echo "::error::missing secrets:$missing"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist/site
      # Served as is by the web server beside each original; binary pages and caches do not shrink.
      - name: Pre-compress the text files
        run: >-
          find dist/site -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' -o -name '*.mjs'
          -o -name '*.svg' -o -name '*.json' -o -name '*.xml' -o -name '*.txt' -o -name '*.gltf'
          -o -name '*.obj' -o -name '*.wasm' \) -exec gzip -9 -k -f {} +
      - name: Install the deploy key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy ~/.ssh/known_hosts
      # The key is restricted to the web root on the server, so the target path is that root.
      # `openworld/` belongs to pasquelin/Trillion3D-openworld's deploy: never deleted from here.
      - name: Transfer
        run: >-
          rsync -rltz --delete-delay --delay-updates --stats --exclude '.well-known/'
          --exclude 'openworld/'
          -e "ssh -p $DEPLOY_SSH_PORT -i $HOME/.ssh/deploy -o StrictHostKeyChecking=yes"
          dist/site/ "$DEPLOY_TARGET:/"
      # The address checked is the one the built page declares canonical (scripts/docs/site.ts).
      # Each answer must carry the cross-origin isolation `scripts/docs/serve.ts` serves locally:
      # without it `crossOriginIsolated` is false and the physics falls back to one thread.
      - name: Check the published site
        run: |
          url=$(grep -o 'rel="canonical" href="[^"]*"' dist/site/index.html | sed 's/.*href="//; s/"$//')
          test -n "$url" || { echo "::error::no canonical address in index.html"; exit 1; }
          for page in "$url" "${url}runtime/portal.js"; do
            headers=$(curl -fsS -D - -o /dev/null --retry 2 --retry-all-errors --retry-delay 10 "$page")
            echo "$headers" | head -n 1
            for header in 'cross-origin-opener-policy: same-origin' \
              'cross-origin-embedder-policy: credentialless'; do
              echo "$headers" | tr -d '\r' | grep -qix "$header" ||
                { echo "::error::$page does not answer '$header'"; exit 1; }
            done
          done
