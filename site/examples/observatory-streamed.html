<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Streamed clusters</title>
    <meta name="thumbnail" content="5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, light, pose } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      // The scene's own sun lights it with 2400 lux: an incident meter reading E asks for
      // EV100 = log2(E × 100 / 250), the exposure fixed for it, as `light-in-real-units` reads its sun.
      const ev100 = Math.log2((2400 * 100) / 250);
      world.exposure = 1 / (1.2 * 2 ** ev100);
      // A scene file carries only its sun: what the sun misses would be black. The court is
      // outdoors, and its scene declares its sky beside its source, as a share of the sun; it is
      // read while the model loads.
      // The compiler cut the model into clusters of triangles, and each cluster into coarser
      // versions of itself. Every frame the engine picks, for each part of the view, the
      // coarsest version whose error stays under `pixelError` pixels on screen.
      const [sky, model] = await Promise.all([
        fetch('../assets/gallery/signature-architecture/source/sky.json').then((response) => response.json()),
        world.scene.load('../assets/gallery/signature-architecture/cache/native/full/manifest.json'),
      ]);
      const [sun] = model.lights;
      world.scene.add(light.hemisphere({ ...sky, intensity: sun.intensity * sky.sunShare }));
      const framing = pose.fromBounds(model.bounds);
      world.camera.set(framing);
      world.controls.target.set(...framing.target);
      world.camera.position.lerp(world.controls.target, 0.4);

      // The page opens on the clusters, one colour each: `world.diagnostic.mode` swaps the image
      // for a view of the engine's own work, and the stats panel's View menu follows it.
      world.diagnostic.mode = 'clusters';
      controls({ pixelError: [0, 16, 0, 0.5] }, (values) => {
        world.pixelError = values.pixelError;
      });
      world.invalidate();
    </script>
  </body>
</html>
