<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Glass on the table</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0d1017;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, texture, effect, math } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#0d1017');

      // A checkered table and a striped wall behind it, so the glass has something to bend. Each
      // is one box wearing a picture drawn on a canvas: twelve by twelve squares, fifteen bands.
      const picture = (width, height, cells, paint) => {
        const canvas = document.createElement('canvas'), pen = canvas.getContext('2d');
        canvas.width = width;
        canvas.height = height;
        for (let x = 0; x < cells[0]; x++)
          for (let y = 0; y < cells[1]; y++) {
            pen.fillStyle = paint(x, y);
            pen.fillRect((x * width) / cells[0], (y * height) / cells[1], width / cells[0], height / cells[1]);
          }
        return texture.canvas(canvas);
      };
      const checks = picture(240, 240, [12, 12], (x, y) => ((x + y) % 2 ? '#27313f' : '#f2efe6'));
      // Seen at a low angle, the checks stay sharp: the texture is read along the slant.
      checks.anisotropy = 8;
      const table = object.mesh(geometry.box(6, 0.1, 6), material.meshStandard({ map: checks, roughness: 0.6 }));
      table.position.y = -0.05;
      const BANDS = ['#e0663c', '#f2b134', '#3cb4a0', '#3c6ee0', '#a04ad0'];
      const bands = picture(600, 8, [15, 1], (x) => BANDS[x % BANDS.length]);
      const wall = object.mesh(geometry.box(6, 3, 0.1), material.meshStandard({ map: bands, roughness: 0.7 }));
      wall.position.set(0, 1.5, -3.05);
      world.scene.add(table, wall);

      // Three shapes of the same glass: `transmission` lets light through, `ior` sets how much
      // it bends, `thickness` how far it travels inside.
      const glass = material.meshPhysical({ color: '#ffffff', roughness: 0.02, transmission: 1, ior: 1.5, thickness: 1 });
      const pieces = [
        [geometry.sphere(0.6, 64, 32), [-1.4, 0.6, 0]],
        [geometry.torusKnot(0.38, 0.14, 200, 32), [0, 0.75, 0.3]],
        [geometry.cylinder(0.5, 0.5, 1.2, 64), [1.4, 0.6, 0]],
      ].map(([shape, at]) => {
        const piece = object.mesh(shape, glass);
        piece.position.set(...at);
        world.scene.add(piece);
        return piece;
      });
      // A dim room: a low sun for the shadows and the edges of the glass, a cool lamp, and a warm
      // panel washing the striped wall, so what the glass bends is the brightest thing behind it.
      // A touch of bloom lets the brightest edges spill a little.
      world.scene.add(light.directional({ intensity: 1.6, color: '#fff4e6', position: [3, 8, 5], castShadow: true }));
      world.scene.add(light.point({ intensity: 20, color: '#9ec2ff', position: [-3, 3, 2], distance: 12 }));
      const wash = light.rectArea({ intensity: 4, color: '#ffd9b0', width: 6, height: 0.5, position: [0, 3.4, -1.4] });
      wash.lookAt(0, 1.4, -3);
      world.scene.add(wash);
      world.effects.add(effect.bloom({ intensity: 0.06 }));
      world.camera.position.set(0, 2.2, 4.6);
      world.camera.lookAt(0, 0.5, 0);
      world.controls.target.set(0, 0.5, 0);

      const ui = controls({ refraction: [1, 2.4, 1.5], thickness: [0, 3, 1], tint: '#ffffff', spin: true }, (values) => {
        glass.ior = values.refraction;
        glass.thickness = values.thickness;
        glass.color.set(values.tint);
      }, world);
      world.onFrame(({ delta }) => {
        if (!ui.spin) return;
        for (const piece of pieces) piece.rotation.y += delta * 0.6;
        world.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
