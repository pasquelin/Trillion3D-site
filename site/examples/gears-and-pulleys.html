<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Gears and pulleys</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #17110d;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, joint, effect } from '../runtime/engine.js';
      import { controls, readout } from '../runtime/kit.js';

      // A clockwork of gears, a lift driven by a rack and pinion, and a bucket on a rope over two
      // pulley wheels. Every wheel turns on a hinge; `joint.gear`, `joint.rackAndPinion` and
      // `joint.pulley` are Jolt's own constraints that tie the bodies' motions together.
      const world = createWorld('view', { controls: 'orbit', physics: true });
      // A dark workshop: a wooden wall, a worn floor, one warm lamp. The metal has only the lights to
      // shine with, so they are few and warm, and bloom lets their glints spill a little.
      world.scene.background = math.color('#17110d');
      world.camera.far = 300;
      world.effects.add(effect.bloom({ intensity: 0.06 }));

      // One material per colour and matter, shared by every part painted with it.
      const paints = new Map();
      const paint = (color, physics = 'metal', metalness = 0.6) => {
        const key = `${color} ${physics} ${metalness}`;
        if (!paints.has(key))
          paints.set(key, material.meshStandard({ color, roughness: 0.45, metalness, physics }));
        return paints.get(key);
      };
      const place = (mesh, at, physics) => {
        mesh.position.set(...at);
        mesh.castShadow = mesh.receiveShadow = true;
        if (physics) mesh.physics = physics;
        world.scene.add(mesh);
        return mesh;
      };
      const block = (size, at, color, physics, metalness) =>
        place(object.mesh(geometry.box(...size), paint(color, 'wood', metalness)), at, physics);
      block([26, 1, 10], [0, -0.5, 0], '#3d332c', 'static', 0);
      block([26, 9, 0.3], [0, 4.5, -0.9], '#5e3f29', 'static', 0);

      // A gear: one solid wheel, its outline cut as a flat shape and pushed DEPTH deep. Every gear
      // has the same tooth spacing (PITCH metres along its pitch circle), so their numbers of teeth
      // set the ratios. The teeth have involute flanks, the curve a taut thread draws unwinding from
      // a circle: two such wheels roll on each other at a steady ratio. Tips stand MODULE past the
      // pitch circle, roots 1.25 MODULE inside it; tooth k is centred on `phase` + k × 2π / teeth.
      const PITCH = 0.3,
        DEPTH = 0.25,
        MODULE = PITCH / Math.PI,
        PRESSURE = (20 * Math.PI) / 180;
      const involute = (angle) => Math.tan(angle) - angle;
      const polar = (rho, angle) => [rho * Math.cos(angle), rho * Math.sin(angle)];
      const wheelShape = (teeth, spokes) => {
        const pitch = (MODULE * teeth) / 2,
          tip = pitch + MODULE,
          root = pitch - 1.25 * MODULE;
        const base = pitch * Math.cos(PRESSURE),
          step = (2 * Math.PI) / teeth;
        // Half a tooth's width, as an angle, at the radius rho: a little under a quarter step on the
        // pitch circle, the play that keeps two wheels from binding.
        const half = (rho) =>
          step * 0.23 + involute(PRESSURE) - involute(Math.acos(Math.min(1, base / rho)));
        const outline = [];
        for (let k = 0; k < teeth; k++) {
          const flank = [0, 0.25, 0.5, 0.75, 1].map((t) => root + (tip - root) * t);
          for (const rho of flank) outline.push(polar(rho, k * step - half(rho)));
          for (const rho of flank.reverse()) outline.push(polar(rho, k * step + half(rho)));
        }
        const shape = math.shape(outline);
        // A large wheel is lightened by windows between its spokes: along the rim, back by the hub.
        const rim = root - 2 * MODULE,
          hub = rim * 0.28,
          width = rim * 0.14;
        for (let s = 0; s < spokes; s++) {
          const from = (s * 2 * Math.PI) / spokes,
            to = from + (2 * Math.PI) / spokes;
          const window = math.shape();
          window.absarc(0, 0, rim, from + width / 2 / rim, to - width / 2 / rim);
          window.absarc(0, 0, hub, to - width / 2 / hub, from + width / 2 / hub, true);
          shape.holes.push(window);
        }
        return shape;
      };
      // Pushed along z and centred on its plane, its edges rounded by a bevel that catches the light.
      const solid = (shape) =>
        geometry
          .extrude(shape, {
            depth: DEPTH - 0.06,
            bevelThickness: 0.03,
            bevelSize: 0.006,
            bevelSegments: 2,
            curveSegments: 16,
          })
          .translate(0, 0, -(DEPTH - 0.06) / 2);
      // The body is a plain cylinder inside the roots, turned to lie along z: the wheels never
      // touch, their joints alone tie them together.
      const alongZ = [Math.SQRT1_2, 0, 0, Math.SQRT1_2];
      const gear = (teeth, at, color, phase = 0) => {
        const radius = (MODULE * teeth) / 2;
        const wheel = solid(wheelShape(teeth, teeth >= 24 ? 5 : 0)).rotateZ(phase);
        const hub = object.mesh(wheel, paint(color));
        hub.teeth = teeth;
        hub.radius = radius;
        const core = { type: 'cylinder', halfHeight: DEPTH / 2, radius: radius - 1.25 * MODULE - 0.03, quaternion: alongZ };
        place(hub, at, { type: 'dynamic', mass: 4 * radius, shape: { type: 'compound', parts: [core] } });
        return hub;
      };
      // Each wheel turns on a pin through its centre (the anchor defaults to the body's position).
      const hinge = (hub, motor) => joint.hinge(hub, null, { axis: [0, 0, 1], motor });
      const joints = [];

      // The clockwork: a driven wheel and three more, each meshing the one before at `bearing`
      // (radians from it). The next wheel's teeth start half a pitch past the last one's at the
      // point where they touch, so tooth meets gap. Of two meshing wheels, one has a whole
      // multiple of the other's teeth: then the gear holds them in that phase, not only in step.
      const train = [
        { teeth: 36, bearing: 0, color: '#c9a227' },
        { teeth: 12, bearing: 0.35, color: '#b87333' },
        { teeth: 24, bearing: -0.5, color: '#c9a227' },
        { teeth: 12, bearing: 0.6, color: '#8d99a6' },
      ];
      const wheels = [];
      let phase = 0;
      for (const [i, { teeth, bearing, color }] of train.entries()) {
        const last = wheels[i - 1];
        const radius = (MODULE * teeth) / 2;
        const at = last
          ? [
              last.position.x + (last.radius + radius) * Math.cos(bearing),
              last.position.y + (last.radius + radius) * Math.sin(bearing),
              0,
            ]
          : [-9, 4.2, 0];
        if (last) {
          const pitchAngle = (2 * Math.PI) / last.teeth;
          const offset =
            ((((phase - bearing) % pitchAngle) + pitchAngle) % pitchAngle) * last.radius;
          phase = bearing + Math.PI - (offset + PITCH / 2) / radius;
        }
        wheels.push(gear(teeth, at, color, phase));
      }
      // The last wheel carries a hand.
      const hand = object.mesh(geometry.box(0.08, 1.1, 0.06), paint('#2b303a'));
      hand.position.set(0, 0.45, DEPTH / 2 + 0.04);
      wheels[3].add(hand);
      const driver = hinge(wheels[0], { mode: 'velocity', target: 0.8, maxForce: 400 });
      joints.push(driver, ...wheels.slice(1).map((hub) => hinge(hub)));
      for (let i = 1; i < wheels.length; i++)
        joints.push(
          joint.gear(wheels[i - 1], wheels[i], {
            axis: [0, 0, 1],
            ratio: wheels[i - 1].teeth / wheels[i].teeth,
          }),
        );

      // The lift: a pinion turns in place and climbs a toothed rack that slides up its rail,
      // carrying a platform and a crate. A turn of the pinion moves the rack by its rim, so the
      // ratio is 1 / its radius (radians per metre).
      const pinion = gear(12, [0, 3.4, 0], '#8d99a6');
      const RACK = 5.4,
        LINE = 0.3;
      const rack = block([0.3, RACK, 0.3], [pinion.radius + LINE, RACK / 2 + 0.2, 0], '#6b7480', {
        type: 'dynamic',
        mass: 20,
      });
      // Its teeth face the pinion's: half a pitch above the pinion's tooth on the line they share.
      // A rack is a gear of infinite radius: its flanks are straight, leaning at the pressure angle,
      // its pitch line LINE in front of the bar's middle, where the pinion's pitch circle touches.
      const toothAt = 3.4 + PITCH / 2 - rack.position.y;
      const lowest = toothAt - PITCH * Math.floor((toothAt + RACK / 2) / PITCH);
      const lean = Math.tan(PRESSURE),
        tipHalf = PITCH * 0.23 - MODULE * lean,
        rootHalf = PITCH * 0.23 + 1.25 * MODULE * lean;
      const [tip, root, back] = [-LINE - MODULE, -LINE + 1.25 * MODULE, -0.14];
      const strip = [[back, -RACK / 2], [root, -RACK / 2]];
      for (let y = lowest; y + rootHalf < RACK / 2; y += PITCH)
        if (y - rootHalf > -RACK / 2)
          strip.push([root, y - rootHalf], [tip, y - tipHalf], [tip, y + tipHalf], [root, y + rootHalf]);
      strip.push([root, RACK / 2], [back, RACK / 2]);
      rack.add(object.mesh(solid(math.shape(strip)), paint('#6b7480')));
      const platform = block(
        [1.8, 0.12, 1.4],
        [rack.position.x + 1.05, RACK + 0.26, 0],
        '#b98b57',
        {
          type: 'dynamic',
          mass: 8,
        },
      );
      block([0.7, 0.7, 0.7], [rack.position.x + 1.1, RACK + 0.7, 0], '#c08a4d', {
        type: 'dynamic',
        mass: 6,
      });
      const lift = hinge(pinion, { mode: 'velocity', target: -1, maxForce: 3000 });
      joints.push(
        lift,
        joint.slider(rack, null, { axis: [0, 1, 0], limits: { min: 0, max: 2.6 } }),
        joint.fixed(platform, rack),
        joint.rackAndPinion(pinion, rack, {
          axis: [0, 0, 1],
          axisB: [0, 1, 0],
          ratio: 1 / pinion.radius,
        }),
      );

      // The pulley: a bucket and a counterweight of the same mass hang on one rope over two
      // wheels; what goes into the bucket takes it down and lifts the weight.
      const TOP = 7.6;
      const over = [
        [6, TOP, 0],
        [9, TOP, 0],
      ];
      block([4.4, 0.2, 0.4], [7.5, TOP + 0.5, -0.4], '#6b4f36', 'static');
      // A pulley wheel is turned on a lathe: a thin web between two flanges, a groove for the rope,
      // two crossed ribs on the web that show it turning.
      const sheave = geometry.lathe(
        [[0, -0.04], [0.25, -0.04], [0.27, -0.09], [0.35, -0.09], [0.35, -0.06], [0.3, 0],
          [0.35, 0.06], [0.35, 0.09], [0.27, 0.09], [0.25, 0.04], [0, 0.04]],
        48,
      );
      const rib = geometry.box(0.5, 0.12, 0.05);
      const pulleys = over.map((at) => {
        const wheel = object.mesh(sheave, paint('#8d99a6'));
        wheel.rotation.x = Math.PI / 2;
        for (const turn of [0, Math.PI / 2]) {
          const spoke = object.mesh(rib, paint('#2b303a'));
          spoke.rotation.y = turn;
          wheel.add(spoke);
        }
        return place(wheel, at);
      });
      // The bucket: its floor is the body, its four walls parts of the same compound shape.
      const walls = [
        { type: 'box', halfExtents: [0.05, 0.45, 0.5], position: [-0.55, 0.5, 0] },
        { type: 'box', halfExtents: [0.05, 0.45, 0.5], position: [0.55, 0.5, 0] },
        { type: 'box', halfExtents: [0.6, 0.45, 0.05], position: [0, 0.5, -0.45] },
        { type: 'box', halfExtents: [0.6, 0.45, 0.05], position: [0, 0.5, 0.45] },
      ];
      const bucket = object.mesh(geometry.box(1.2, 0.1, 1), paint('#b87333'));
      for (const {
        halfExtents: [x, y, z],
        position,
      } of walls) {
        const wall = object.mesh(geometry.box(2 * x, 2 * y, 2 * z), paint('#b87333'));
        wall.position.set(...position);
        wall.castShadow = true;
        bucket.add(wall);
      }
      const floor = { type: 'box', halfExtents: [0.6, 0.05, 0.5] };
      place(bucket, [6, 2.1, 0], {
        type: 'dynamic',
        mass: 6,
        shape: { type: 'compound', parts: [floor, ...walls] },
      });
      const counterweight = block([0.8, 0.8, 0.8], [9, 3.6, 0], '#3c434d', {
        type: 'dynamic',
        mass: 6,
      });
      // Where the rope holds each: the bucket's rim, the weight's top.
      const hooks = [1, 0.4];
      joints.push(
        joint.pulley(bucket, counterweight, { anchor: [6, 3.1, 0], anchorB: [9, 4, 0], over }),
      );
      // The rope, drawn from each hook up to its wheel.
      const ropes = [0, 1].map(() => {
        const rope = object.mesh(geometry.cylinder(0.03, 0.03, 1, 8), paint('#6b4f36', 'wood', 0));
        world.scene.add(rope);
        return rope;
      });
      const top = object.mesh(geometry.box(3, 0.06, 0.06), paint('#6b4f36', 'wood', 0));
      place(top, [7.5, TOP + 0.35, 0]);
      for (const j of joints) world.physics.add(j);

      let load = [];
      controls(
        {
          speed: [-3, 3, 0.8, 0.1],
          raiseLift: false,
          addWeight: () => {
            const weight = block(
              [0.35, 0.35, 0.35],
              [6 + (Math.random() - 0.5) * 0.4, 6.4, 0],
              '#6f6a64',
              {
                type: 'dynamic',
                mass: 3,
              },
            );
            load.push(weight);
          },
          emptyBucket: () => {
            for (const weight of load) world.scene.remove(weight);
            load = [];
          },
        },
        ({ speed, raiseLift }) => {
          // A motor is changed at any time: the geared wheels and the rack follow their driver.
          driver.motor = { mode: 'velocity', target: speed, maxForce: 400 };
          lift.motor = { mode: 'velocity', target: raiseLift ? 1.2 : -1.2, maxForce: 3000 };
        },
        world,
      );

      // A warm key from high on the left rakes across the wall and throws the wheels' shadows on
      // it; a dim warm sky fills; a bare bulb over the bench is the workshop's own lamp.
      const sun = light.directional({ intensity: 3.5, color: '#ffd9a8', castShadow: true });
      sun.position.set(-8, 14, 12);
      const bulb = object.mesh(geometry.sphere(0.12, 24, 12), material.meshBasic({ color: '#ffe0a8' }));
      const shade = object.mesh(
        geometry.cylinder(0.12, 0.45, 0.35, 32),
        paint('#2f3a33', 'metal', 0.3),
      );
      shade.position.y = 0.2;
      const cord = object.mesh(geometry.cylinder(0.01, 0.01, 1.4, 6), paint('#111111', 'wood', 0));
      cord.position.y = 1.05;
      bulb.add(shade, cord, light.point({ position: [0, -0.15, 0], intensity: 30, distance: 14, color: '#ffc77a' }));
      place(bulb, [-3.2, 7.6, 1.6]);
      world.scene.add(
        sun,
        light.hemisphere({ intensity: 0.4, color: '#ffe6c8', groundColor: '#2a1f18' }),
      );
      world.camera.position.set(0, 6, 17);
      world.controls.target.set(0, 4, 0);

      const height = readout('lift'),
        weights = readout('load'),
        rope = readout('rope');
      const start = [rack.position.y, bucket.position.y];
      world.onFrame(() => {
        [bucket, counterweight].forEach((body, i) => {
          const [x, y] = [body.position.x, body.position.y + hooks[i]];
          const [dx, dy] = [over[i][0] - x, over[i][1] - y];
          ropes[i].position.set(x + dx / 2, y + dy / 2, 0);
          ropes[i].scale.set(1, Math.hypot(dx, dy), 1);
          ropes[i].rotation.z = -Math.atan2(dx, dy);
        });
        // The wheels turn as the rope runs over them.
        const run = start[1] - bucket.position.y;
        for (const wheel of pulleys) wheel.rotation.y = run / 0.35;
        height(`${(rack.position.y - start[0]).toFixed(2)} m`);
        weights(String(load.length));
        rope(`${run.toFixed(2)} m`);
      });
    </script>
  </body>
</html>
