<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rolling on terrain</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        top: 0;
        margin: 0.5rem;
        color: #1f2a37;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p data-words="credit"></p>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, physicsReadouts, seeded } from '../runtime/kit.js';

      // A compiled valley: its collision was cooked with it — a height field for the grid, tiles
      // for the boulders — and the physics streams it in on its own once it is on.
      const world = createWorld('view', { controls: 'orbit', physics: true });
      world.scene.background = math.color('#a4cbec');
      // A light haze over the far side of the valley. The fog is light, exposed and tone-mapped
      // like a surface, the background is not: this is the radiance the display curve shows as
      // #a4cbec.
      world.scene.fog = { color: math.color([0.194, 0.557, 1.466]), near: 90, far: 400 };
      world.camera.far = 400;
      await world.scene.load('../assets/examples/terrain/cache/native/full/manifest.json');

      // A low, warm afternoon sun: the hills are modelled by their shade, the balls by theirs.
      const sun = light.directional({ color: '#ffd9a8', intensity: 3, castShadow: true });
      sun.position.set(60, 35, -10);
      world.scene.add(
        sun,
        light.hemisphere({ intensity: 0.5, color: '#cfe2ff', groundColor: '#6d7a5a' }),
      );
      world.camera.position.set(34, 42, 46);
      world.controls.target.set(0, 0, 0);

      const matters = {
        rubber: material.meshStandard({ color: '#d0453f', roughness: 0.5, physics: 'rubber' }),
        stone: material.meshStandard({ color: '#8f8a83', roughness: 0.9, physics: 'stone' }),
        ice: material.meshStandard({ color: '#a9d8f0', roughness: 0.1, physics: 'ice' }),
      };
      // At most a few hundred balls: past that, each new one takes the place of the oldest, and a
      // ball that rolled off the valley is taken away once it has fallen below it.
      const MOST = 240;
      const ball = geometry.sphere(1, 24, 16),
        next = seeded(5),
        balls = [];
      const drop = (x, y, z, matter) => {
        if (balls.length >= MOST) world.scene.remove(balls.shift());
        const body = object.mesh(ball, matters[matter]);
        body.position.set(x, y, z);
        body.castShadow = true;
        // A dynamic body: a sphere read from the geometry, rolling on the cooked ground.
        body.physics = 'dynamic';
        world.scene.add(body);
        balls.push(body);
      };
      world.onFrame(() => {
        for (let k = balls.length - 1; k >= 0; k--)
          if (balls[k].position.y < -40) world.scene.remove(balls.splice(k, 1)[0]);
      });
      const rain = () => {
        for (let i = 0; i < 20; i++)
          drop((next() - 0.5) * 100, 30, (next() - 0.5) * 100, settings.matter);
      };
      const settings = controls({ matter: ['rubber', 'stone', 'ice'], rain }, () => {}, world);
      rain();

      // A click asks the physics where the ray meets the ground: the exact cooked surface, not the
      // model's box. A ball is dropped two metres above that point.
      document.getElementById('view').addEventListener('pointerdown', async (event) => {
        const hit = await world.raycast({ x: event.offsetX, y: event.offsetY }, { exact: true });
        if (hit) drop(hit.point.x, hit.point.y + 2, hit.point.z, settings.matter);
      });

      physicsReadouts(world, ['bodies', 'awake', 'step']);
    </script>
  </body>
</html>
