<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A crane that swings</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #d8c8b0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld } from '../runtime/engine.js';
      import { animation, geometry, light, material, math, object } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      // Late afternoon on a building site: a low warm sun, a hazy sky, and the haze thickening
      // with distance and near the ground, so the far end of the site fades into it.
      const sky = math.color('#d8c8b0');
      world.scene.background = sky;
      world.scene.fog = { color: sky, density: 0.02, heightFalloff: 0.25, baseHeight: 0 };
      const yellow = material.meshStandard({ color: '#e5a928', roughness: 0.55, metalness: 0.25 });
      const steel = material.meshStandard({ color: '#343b45', roughness: 0.4, metalness: 0.75 });
      const concrete = material.meshStandard({ color: '#9b958b', roughness: 0.9 });
      const loadPaint = material.meshStandard({ color: '#a8492f', roughness: 0.85 });
      const crane = object.group();
      crane.name = 'crane';
      const add = (parent, shape, paint, at) => {
        const mesh = object.mesh(shape, paint);
        mesh.position.set(...at);
        parent.add(mesh);
        return mesh;
      };
      // A lattice is many copies of one bar: a unit box stretched between two points. Every bar
      // shares the one geometry and the one paint, so the engine draws them all as a batch.
      const BAR = geometry.box(1, 1, 1);
      const UP = math.vector3(0, 1, 0), along = math.vector3();
      const strut = (parent, from, to, thickness = 0.04, paint = yellow) => {
        along.set(to[0] - from[0], to[1] - from[1], to[2] - from[2]);
        const length = along.length();
        const bar = add(parent, BAR, paint, from.map((v, i) => (v + to[i]) / 2));
        bar.scale.set(thickness, length, thickness);
        bar.quaternion.setFromUnitVectors(UP, along.normalize());
      };

      // The tower stays still: four corner chords, and on each face a rung and a diagonal per
      // section, the diagonals zigzagging up. The named groups above it are the parts the public
      // clip addresses.
      add(crane, geometry.box(2.4, 0.35, 2.4), steel, [0, 0.18, 0]);
      const SECTIONS = 8, FOOT = 0.35, HEAD = 6, W = 0.33;
      const corners = [[-W, -W], [W, -W], [W, W], [-W, W]];
      const h = (HEAD - FOOT) / SECTIONS;
      for (const [x, z] of corners) strut(crane, [x, FOOT, z], [x, HEAD, z], 0.08);
      for (let i = 0; i < SECTIONS; i++)
        corners.forEach(([x, z], k) => {
          const [nx, nz] = corners[(k + 1) % 4], y = FOOT + i * h;
          strut(crane, [x, y + h, z], [nx, y + h, nz]);
          if (i % 2) strut(crane, [x, y, z], [nx, y + h, nz]);
          else strut(crane, [nx, y, nz], [x, y + h, z]);
        });
      add(crane, geometry.cylinder(0.5, 0.5, 0.18, 32), steel, [0, HEAD, 0]);

      const jib = object.group();
      jib.name = 'jib';
      jib.position.y = HEAD + 0.1;
      // The jib: a triangular girder, two bottom chords the trolley runs under and a top chord,
      // braced panel by panel. Behind it the counter-jib carries the concrete counterweight.
      const PANEL = 0.5, PANELS = 10, ROOT = 0.2, END = ROOT + PANEL * (PANELS - 1);
      const low = (x, side) => [x, -0.12, side * 0.2], high = (x) => [x, 0.3, 0];
      for (const side of [-1, 1]) strut(jib, low(ROOT, side), low(END + PANEL, side), 0.06);
      strut(jib, high(ROOT), high(END), 0.06);
      for (let i = 0; i < PANELS; i++) {
        const x = ROOT + i * PANEL, top = Math.min(x + PANEL / 2, END);
        strut(jib, low(x + PANEL, -1), low(x + PANEL, 1));
        for (const side of [-1, 1]) {
          strut(jib, low(x, side), high(top));
          strut(jib, high(top), low(x + PANEL, side));
        }
      }
      for (const side of [-1, 1]) strut(jib, [-0.4, 0, side * 0.3], [-3.6, 0, side * 0.3], 0.07);
      for (let i = 0; i < 6; i++) strut(jib, [-0.4 - i * 0.6, 0, -0.3], [-0.4 - i * 0.6, 0, 0.3]);
      const slab = geometry.box(0.26, 0.8, 0.7);
      for (const x of [-3.4, -3.1, -2.8]) add(jib, slab, concrete, [x, -0.3, 0]);
      // The apex over the tower, and the pendant bars that hang both jibs from it.
      const apex = [0, 1.7, 0];
      for (const [x, z] of corners) strut(jib, [x, 0.1, z], apex, 0.06);
      strut(jib, apex, high(ROOT + PANEL * 7), 0.025, steel);
      strut(jib, apex, [-3.5, 0.05, 0], 0.025, steel);
      // The cab, beside the tower's head and clear of it as the jib slews, its glass towards the jib.
      add(jib, geometry.box(0.7, 0.65, 0.6), material.meshStandard({ color: '#eeeae2', roughness: 0.5 }), [0.9, -0.45, 0.7]);
      add(jib, geometry.box(0.05, 0.4, 0.5), material.meshStandard({ color: '#1d2a33', roughness: 0.1, metalness: 0.4 }), [1.26, -0.4, 0.7]);
      const trolley = object.group();
      trolley.name = 'trolley';
      trolley.position.set(2, -0.3, 0);
      add(trolley, geometry.box(0.45, 0.25, 0.55), steel, [0, 0, 0]);
      const hoist = object.group();
      hoist.name = 'hoist';
      hoist.position.y = -0.1;
      const cable = object.group();
      cable.name = 'cable';
      add(cable, geometry.cylinder(0.025, 0.025, 2, 8), steel, [0, -1, 0]);
      // The load hangs from a hook block on four slings: a pallet of bricks.
      const load = object.group();
      load.name = 'load';
      load.position.y = -2.1;
      add(load, geometry.box(0.3, 0.24, 0.16), yellow, [0, -0.12, 0]);
      for (const [x, z] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) strut(load, [0, -0.24, 0], [x * 0.5, -0.75, z * 0.38], 0.015, steel);
      add(load, geometry.box(1.15, 0.6, 0.9), loadPaint, [0, -1.05, 0]);
      add(load, geometry.box(1.25, 0.12, 1), material.meshStandard({ color: '#8a6a45', roughness: 0.9 }), [0, -1.41, 0]);
      hoist.add(cable, load);
      trolley.add(hoist);
      jib.add(trolley);
      crane.add(jib);
      world.scene.add(crane);

      // One repeated clip coordinates the crane: slew, trolley travel, hoist and load swing.
      const times = [0, 2, 4, 6, 8];
      const motion = animation.clip('lift', 8, [
        animation.numberTrack('jib.rotation.y', times, [0, 0.55, 0.15, -0.5, 0]),
        animation.numberTrack('trolley.position.x', times, [1.5, 3.6, 3.6, 1.5, 1.5]),
        animation.numberTrack('cable.scale.y', times, [1, 1, 0.55, 0.55, 1]),
        animation.numberTrack('load.position.y', times, [-2.1, -2.1, -1.2, -1.2, -2.1]),
        animation.numberTrack('hoist.rotation.z', times, [0, 0.28, -0.22, 0.16, 0]),
      ]);
      const mixer = animation.createMixer(crane);
      const action = mixer.play(motion);
      let paused = false;
      const replay = () => {
        action.stop().play();
        mixer.update(0);
        action.playingNow = !paused;
        world.invalidate();
      };

      controls(
        {
          speed: [0.2, 2, 1, 0.1],
          paused: false,
          replay,
        },
        (values) => {
          paused = values.paused;
          action.timeScale = values.speed;
          if (paused) action.playingNow = false;
          else action.play();
          world.invalidate();
        },
        world,
      );

      // The site: a dirt ground running out into the haze, a concrete pad under the crane, a site
      // hut, a stack of pipes and pallets of bricks waiting their turn.
      const ground = object.mesh(
        geometry.box(400, 0.2, 400),
        material.meshStandard({ color: '#8a7656', roughness: 0.95 }),
      );
      ground.position.y = -0.1;
      const site = object.group();
      add(site, geometry.box(4, 0.1, 4), concrete, [0, 0.05, 0]);
      add(site, geometry.box(3.2, 1.3, 1.6), material.meshStandard({ color: '#4f7a8c', roughness: 0.7 }), [-6, 0.65, -4]);
      add(site, geometry.box(3.4, 0.08, 1.8), steel, [-6, 1.34, -4]);
      const pipe = geometry.cylinder(0.18, 0.18, 3, 20);
      for (const [z, y] of [[0, 0.18], [0.37, 0.18], [0.74, 0.18], [0.18, 0.5], [0.55, 0.5]])
        add(site, pipe, steel, [5, y, -5 + z]).rotation.set(0, 0, Math.PI / 2);
      const pallet = geometry.box(1.15, 0.72, 0.9);
      for (const [x, z] of [[4.5, 3], [5.9, 3], [4.5, 4.3]]) add(site, pallet, loadPaint, [x, 0.36, z]);
      world.scene.add(
        ground,
        site,
        light.directional({
          intensity: 4,
          color: '#ffc68a',
          position: [14, 5, 8],
          castShadow: true,
        }),
        light.hemisphere({ intensity: 0.8, color: '#c6d4e6', groundColor: '#6b5a45' }),
      );
      world.camera.position.set(10, 7, 13);
      world.controls.target.set(0, 3, 0);
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;
    </script>
  </body>
</html>
