<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Boolean shapes</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #10141c;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { buffer, createWorld, effect, geometry, light, material, math, object } from '../runtime/engine.js';
      import { controls, readout } from '../runtime/kit.js';

      // Constructive solid geometry, written in the page: every solid is a list of flat polygons,
      // and a binary space partition tree of a solid says, for any point, whether it is inside.
      // Union, subtraction and intersection are each a few clips of one tree's polygons by the
      // other's (after Naylor, Amanatides and Thibault, 1990). The whole of it is one function,
      // run in a worker so the view never waits for a cut: it takes triangle soups in and gives
      // the triangles of the result back.
      function kernel() {
        // A corner is nine numbers: where it is, the way its surface faces, and its colour.
        // Corners and planes are never changed in place, so pieces of one polygon share them.
        const EPSILON = 1e-5;
        const lerp = (a, b, t) => a.map((value, at) => value + (b[at] - value) * t);
        const flipCorner = (c) => [c[0], c[1], c[2], -c[3], -c[4], -c[5], c[6], c[7], c[8]];
        const flipPlane = (p) => [-p[0], -p[1], -p[2], -p[3]];
        const flipPolygon = ({ corners, plane }) => ({ corners: corners.map(flipCorner).reverse(), plane: flipPlane(plane) });
        function planeOf(a, b, c) {
          const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
          const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
          let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
          const length = Math.hypot(nx, ny, nz);
          if (length < 1e-12) return null; // a triangle with no area has no side
          nx /= length;
          ny /= length;
          nz /= length;
          return [nx, ny, nz, nx * a[0] + ny * a[1] + nz * a[2]];
        }

        // A polygon against a plane: wholly in front, wholly behind, in the plane, or cut in two.
        // The signed distances of its corners are kept, to place the cuts without measuring again.
        const IN_PLANE = 0, FRONT = 1, BACK = 2, SPANNING = 3;
        const sides = new Uint8Array(1024), distances = new Float64Array(1024);
        function split(plane, polygon, inFront, inBack, front, back) {
          const nx = plane[0], ny = plane[1], nz = plane[2], w = plane[3], { corners } = polygon, n = corners.length;
          let whole = 0;
          for (let i = 0; i < n; i++) {
            const c = corners[i], t = nx * c[0] + ny * c[1] + nz * c[2] - w;
            const side = t < -EPSILON ? BACK : t > EPSILON ? FRONT : IN_PLANE;
            sides[i] = side;
            distances[i] = t;
            whole |= side;
          }
          if (whole === IN_PLANE) {
            const p = polygon.plane;
            (nx * p[0] + ny * p[1] + nz * p[2] > 0 ? inFront : inBack).push(polygon);
          } else if (whole === FRONT) front.push(polygon);
          else if (whole === BACK) back.push(polygon);
          else {
            const ahead = [], behind = [];
            for (let i = 0; i < n; i++) {
              const j = i + 1 === n ? 0 : i + 1, a = corners[i];
              if (sides[i] !== BACK) ahead.push(a);
              if (sides[i] !== FRONT) behind.push(a);
              if ((sides[i] | sides[j]) === SPANNING) {
                const cut = lerp(a, corners[j], distances[i] / (distances[i] - distances[j]));
                ahead.push(cut);
                behind.push(cut);
              }
            }
            if (ahead.length >= 3) front.push({ corners: ahead, plane: polygon.plane });
            if (behind.length >= 3) back.push({ corners: behind, plane: polygon.plane });
          }
        }

        // The tree: each node a plane, the polygons lying in it, and what is in front and behind.
        // Built, walked and clipped with explicit stacks: a round solid gives a tree as deep as
        // it has faces.
        const node = () => ({ plane: null, polygons: [], front: null, back: null });
        // A whole solid's tree also keeps the box around its polygons, and whether it is turned
        // inside out.
        function solidTree(polygons) {
          const bounds = [Infinity, Infinity, Infinity, -Infinity, -Infinity, -Infinity];
          for (const { corners } of polygons)
            for (const c of corners)
              for (let axis = 0; axis < 3; axis++) {
                bounds[axis] = Math.min(bounds[axis], c[axis]);
                bounds[axis + 3] = Math.max(bounds[axis + 3], c[axis]);
              }
          return Object.assign(build(node(), polygons), { bounds, inverted: false });
        }
        function build(root, polygons) {
          const stack = [[root, polygons]];
          while (stack.length) {
            const [at, list] = stack.pop();
            if (!list.length) continue;
            at.plane ??= list[0].plane;
            const front = [], back = [];
            for (const polygon of list) split(at.plane, polygon, at.polygons, at.polygons, front, back);
            if (front.length) stack.push([(at.front ??= node()), front]);
            if (back.length) stack.push([(at.back ??= node()), back]);
          }
          return root;
        }
        function nodes(root) {
          const out = [], stack = [root];
          while (stack.length) {
            const at = stack.pop();
            out.push(at);
            if (at.front) stack.push(at.front);
            if (at.back) stack.push(at.back);
          }
          return out;
        }
        // Inside becomes outside: every plane and polygon turns round, front and back swap.
        function invert(root) {
          for (const at of nodes(root)) {
            at.polygons = at.polygons.map(flipPolygon);
            if (at.plane) at.plane = flipPlane(at.plane);
            [at.front, at.back] = [at.back, at.front];
          }
          root.inverted = !root.inverted;
          return root;
        }
        // The area of a flat polygon, fanned from its first corner.
        function area({ corners }) {
          let sum = 0;
          const [a] = corners;
          for (let k = 1; k + 1 < corners.length; k++) {
            const b = corners[k], c = corners[k + 1];
            const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
            sum += Math.hypot(uy * vz - uz * vy, uz * vx - ux * vz, ux * vy - uy * vx) / 2;
          }
          return sum;
        }
        // Keeps the parts of `polygon` that lie outside the solid of `root`. A polygon clear of
        // the solid's bounds is settled at once: kept, or, when the tree is turned inside out and
        // the solid is everything outside them, dropped. A polygon cut into pieces that all
        // survive is kept whole: the cuts would only have broken it up for nothing.
        function clipPolygon(root, polygon, kept) {
          let clear = false;
          for (let axis = 0; axis < 3 && !clear; axis++) {
            let low = Infinity, high = -Infinity;
            for (const c of polygon.corners) {
              low = Math.min(low, c[axis]);
              high = Math.max(high, c[axis]);
            }
            clear = high < root.bounds[axis] - 1e-4 || low > root.bounds[axis + 3] + 1e-4;
          }
          if (clear) return void (root.inverted || kept.push(polygon));
          const pieces = [], stack = [[root, [polygon]]];
          while (stack.length) {
            const [at, list] = stack.pop();
            if (!at.plane) {
              pieces.push(...list);
              continue;
            }
            const front = [], back = [];
            for (const each of list) split(at.plane, each, front, back, front, back);
            if (at.front) stack.push([at.front, front]);
            else pieces.push(...front);
            if (at.back) stack.push([at.back, back]);
          }
          if (pieces.length > 1) {
            const whole = area(polygon);
            if (Math.abs(pieces.reduce((sum, piece) => sum + area(piece), 0) - whole) <= whole * 1e-6) return void kept.push(polygon);
          }
          kept.push(...pieces);
        }
        const clipPolygons = (root, polygons) => {
          const kept = [];
          for (const polygon of polygons) clipPolygon(root, polygon, kept);
          return kept;
        };
        function clipTo(root, other) {
          for (const at of nodes(root)) at.polygons = clipPolygons(other, at.polygons);
        }
        const polygonsOf = (root) => nodes(root).flatMap((at) => at.polygons);

        // The three operations, each on two lists of polygons, giving a new list: what is left of
        // both once each is clipped by the other, the last step turned inside out for a
        // subtraction and an intersection.
        const operations = {
          union(left, right) {
            const a = solidTree(left), b = solidTree(right);
            clipTo(a, b);
            clipTo(b, a);
            invert(b);
            clipTo(b, a);
            invert(b);
            return [...polygonsOf(a), ...polygonsOf(b)];
          },
          subtract(left, right) {
            const a = solidTree(left), b = solidTree(right);
            invert(a);
            clipTo(a, b);
            clipTo(b, a);
            invert(b);
            clipTo(b, a);
            invert(b);
            return [...polygonsOf(a), ...polygonsOf(b)].map(flipPolygon);
          },
          intersect(left, right) {
            const a = solidTree(left), b = solidTree(right);
            invert(a);
            clipTo(b, a);
            invert(b);
            clipTo(a, b);
            clipTo(b, a);
            return [...polygonsOf(a), ...polygonsOf(b)].map(flipPolygon);
          },
        };

        // A soup, nine numbers a corner and three corners a triangle, into polygons.
        function polygons(soup) {
          const out = [];
          for (let t = 0; t < soup.length; t += 27) {
            const corners = [0, 9, 18].map((k) => Array.from(soup.subarray(t + k, t + k + 9)));
            const plane = planeOf(...corners);
            if (plane) out.push({ corners, plane });
          }
          return out;
        }
        // The polygons out as triangles, fanned from their first corner.
        function triangles(list) {
          let count = 0;
          for (const { corners } of list) count += corners.length - 2;
          const position = new Float32Array(count * 9), normal = new Float32Array(count * 9), colour = new Float32Array(count * 9);
          let at = 0;
          for (const { corners } of list)
            for (let k = 1; k + 1 < corners.length; k++)
              for (const c of [corners[0], corners[k], corners[k + 1]]) {
                const length = Math.hypot(c[3], c[4], c[5]) || 1;
                position.set([c[0], c[1], c[2]], at);
                normal.set([c[3] / length, c[4] / length, c[5] / length], at);
                colour.set([c[6], c[7], c[8]], at);
                at += 3;
              }
          return { position, normal, colour };
        }

        // The job: a cube and a ball through one operation, or the classic tree — their
        // intersection, then the three bores taken away one after the other.
        return function solve({ operation, cube, ball, bores }) {
          const started = performance.now();
          let out;
          if (operation === 'carved') {
            out = operations.intersect(polygons(cube), polygons(ball));
            for (const bore of bores) out = operations.subtract(out, polygons(bore));
          } else out = operations[operation](polygons(cube), polygons(ball));
          return { ...triangles(out), took: performance.now() - started };
        };
      }

      // The kernel in a worker made from its own source; where no worker can start, in the page.
      let solveHere = null, worker = null;
      try {
        const source = `const solve = (${kernel})(); onmessage = ({ data }) => { const done = solve(data); postMessage(done, [done.position.buffer, done.normal.buffer, done.colour.buffer]); };`;
        worker = new Worker(URL.createObjectURL(new Blob([source], { type: 'text/javascript' })));
      } catch {
        solveHere = kernel();
      }

      // An engine shape with every corner of every triangle its own vertex, so its lists read
      // straight through as triangles; the indexed shape it came from is given back.
      function unshared(shape) {
        const flat = shape.toNonIndexed();
        shape.dispose();
        return flat;
      }
      // An unshared shape into a soup: its corners moved by `at`, each painted in the solid's
      // colour, so every face of the result says where it came from.
      function soup(shape, colour, at = [0, 0, 0]) {
        const position = shape.attributes.position.array, normal = shape.attributes.normal.array;
        const { r, g, b } = math.color(colour);
        const out = new Float32Array(position.length * 3);
        for (let k = 0; k < position.length; k += 3) {
          const corner = k * 3;
          out[corner] = position[k] + at[0];
          out[corner + 1] = position[k + 1] + at[1];
          out[corner + 2] = position[k + 2] + at[2];
          out[corner + 3] = normal[k];
          out[corner + 4] = normal[k + 1];
          out[corner + 5] = normal[k + 2];
          out[corner + 6] = r;
          out[corner + 7] = g;
          out[corner + 8] = b;
        }
        return out;
      }

      const CUBE = '#efe4cf', BALL = '#e0663c', BORE = '#3c8fe0';
      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#10141c');

      // A dark studio: a turned plinth, a key light that throws the shadow, two coloured rims.
      const plinth = object.mesh(geometry.cylinder(2.4, 2.6, 0.35, 96), material.meshStandard({ color: '#1f2532', roughness: 0.45, metalness: 0.25 }));
      plinth.position.y = -0.175;
      const floor = object.mesh(geometry.cylinder(16, 16, 0.1, 96), material.meshStandard({ color: '#131820', roughness: 0.95 }));
      floor.position.y = -0.4;
      world.scene.add(plinth, floor);
      world.scene.add(light.directional({ intensity: 3, color: '#fff3e2', position: [4, 9, 5], castShadow: true }));
      world.scene.add(light.point({ intensity: 26, color: '#ff8a5c', position: [-3.5, 4.5, -3], distance: 9 }));
      world.scene.add(light.point({ intensity: 26, color: '#5cb8ff', position: [3.5, 4.5, -3.5], distance: 9 }));
      world.scene.add(light.hemisphere({ color: '#a8b8e0', groundColor: '#2a221c', intensity: 0.55 }));
      world.effects.add(effect.bloom({ intensity: 0.04 }));

      // The result, floating and turning above the plinth: one mesh with room for many
      // triangles, written again in place by every cut ('dynamic': the world uploads it and
      // never prepares the scene again); the room left over is folded to a point and draws
      // nothing. A result that outgrows it gets a larger mesh, once.
      const holder = object.group();
      holder.position.y = 1.8;
      world.scene.add(holder);
      const matter = material.meshStandard({ vertexColors: true, roughness: 0.32, metalness: 0.05 });
      let room = 0, lists = null, result = null;
      function makeRoom(triangles) {
        room = Math.ceil(triangles / 8192) * 8192;
        const list = () => buffer.float32(new Float32Array(room * 9), 3);
        lists = { position: list(), normal: list(), color: list() };
        const shape = geometry.createBuffer(lists);
        shape.usage = 'dynamic';
        if (result) {
          const worn = result.geometry;
          result.geometry = shape;
          worn.dispose();
        } else result = object.mesh(shape, matter);
      }
      makeRoom(24576);

      // The operands themselves as faint cages around the result, in their colours, built once
      // and only moved and stretched: the cube's twelve edges, a unit ball's meridians and
      // parallels, each bore's two rims.
      const cage = (lines, colour) => object.lineSegments(lines, material.line({ color: colour, transparent: true, opacity: 0.35 }));
      const cubeCage = cage(geometry.edges(geometry.box(2.006, 2.006, 2.006), 30), CUBE);
      const ballCage = cage(geometry.edges(geometry.sphere(1.003, 24, 12), 1), BALL);
      const boreCages = object.group();
      const TURNS = [[0, 0], [Math.PI / 2, 0], [0, Math.PI / 2]];
      for (const [x, z] of TURNS) {
        const rims = cage(geometry.edges(geometry.cylinder(1, 1, 3.2, 40), 30), BORE);
        rims.rotation.set(x, 0, z);
        boreCages.add(rims);
      }
      const ghosts = object.group();
      ghosts.add(cubeCage, ballCage, boreCages);
      holder.add(ghosts);

      world.camera.position.set(0, 3.3, 6.8);
      world.camera.lookAt(0, 1.45, 0);
      world.controls.target.set(0, 1.45, 0);
      world.controls.minDistance = 3;
      world.controls.maxDistance = 14;
      world.controls.maxPolarAngle = Math.PI * 0.53;

      const show = { triangles: null, time: null };
      // One job at a time: a change while the worker cuts waits, and only the latest is sent.
      // The cages take the places of the job shown, so they always frame the cut drawn.
      // Only the room the last result used and this one does not is folded back to a point.
      let busy = false, waiting = false, drift = 0, sent = null, used = 0;
      function receive({ position, normal, colour, took }) {
        const count = position.length / 9;
        if (count > room) {
          makeRoom(count);
          used = 0;
        }
        const { position: p, normal: n, color: c } = lists;
        if (position.length < used) p.array.fill(0, position.length, used);
        used = position.length;
        p.array.set(position);
        n.array.set(normal);
        c.array.set(colour);
        p.needsUpdate = n.needsUpdate = c.needsUpdate = true;
        if (!result.parent) holder.add(result);
        const { values, ballAt, wobble } = sent;
        ballCage.position.set(...ballAt);
        ballCage.scale.setScalar(values.ball);
        boreCages.position.set(...wobble);
        for (const rims of boreCages.children) rims.scale.set(values.bore * 1.006, 1, values.bore * 1.006);
        boreCages.visible = values.operation === 'carved';
        ghosts.visible = values.operands;
        show.triangles?.(String(count));
        show.time?.(`${took.toFixed(0)} ms`);
        busy = false;
        world.invalidate();
        // The next job on a later turn, so a page without a worker still draws between two cuts.
        if (waiting || sent.values.drifting) setTimeout(() => rebuild());
      }
      worker?.addEventListener('message', ({ data }) => receive(data));

      // The operands' shapes: the cube's soup made once (each job sends a copy of it), the ball
      // and the three bores made again only when their slider moves.
      const cubeSoup = soup(unshared(geometry.box(2, 2, 2)), CUBE);
      let ballShape = null, ballRadius = 0, boreShapes = [], boreRadius = 0;
      function shapesFor(values) {
        if (values.ball !== ballRadius) {
          ballShape?.dispose();
          ballShape = unshared(geometry.sphere(values.ball, 40, 20));
          ballRadius = values.ball;
        }
        if (values.bore !== boreRadius) {
          for (const shape of boreShapes) shape.dispose();
          const tube = unshared(geometry.cylinder(values.bore, values.bore, 3.2, 40));
          boreShapes = TURNS.map(([x, z]) => tube.clone().rotateX(x).rotateZ(z));
          tube.dispose();
          boreRadius = values.bore;
        }
      }

      function rebuild(values = ui) {
        if (busy) return void (waiting = true);
        busy = true;
        waiting = false;
        const wobble = values.drifting ? [Math.sin(drift) * 0.32, Math.sin(drift * 1.3) * 0.22, Math.cos(drift * 0.8) * 0.32] : [0, 0, 0];
        const carved = values.operation === 'carved', ballAt = carved ? [0, 0, 0] : wobble;
        shapesFor(values);
        sent = { values: { ...values }, ballAt, wobble };
        const job = { operation: values.operation, cube: cubeSoup, ball: soup(ballShape, BALL, ballAt), bores: carved ? boreShapes.map((bore) => soup(bore, BORE, wobble)) : [] };
        // The ball's and bores' soups are handed over to the worker; the cube's is copied.
        if (worker) worker.postMessage(job, [job.ball.buffer, ...job.bores.map((b) => b.buffer)]);
        else receive(solveHere(job));
      }

      const ui = controls({
        operation: ['carved', 'subtract', 'intersect', 'union'],
        ball: [1.05, 1.7, 1.32, 0.01],
        bore: [0.2, 0.85, 0.56, 0.01],
        drifting: false,
        operands: true,
        spin: true,
      }, (values, key) => {
        if (key !== 'spin') rebuild(values);
      }, world);
      show.triangles = readout('triangles');
      show.time = readout('computedIn');

      // Turning, the result shows its cuts one after the other; drifting, the operands wander
      // and the worker cuts the whole tree again as soon as it is done with the last one.
      let time = 0;
      world.onFrame(({ delta }) => {
        if (ui.drifting) drift += delta * 0.9;
        if (!ui.spin) return;
        time += delta;
        holder.rotation.set(0.42 + Math.sin(time * 0.3) * 0.15, time * 0.45, 0.18);
        world.invalidate();
      });
    </script>
  </body>
</html>
