<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cloth and rope</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #9cc3e6;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, buffer, texture } from '../runtime/engine.js';
      import { controls, physicsReadouts, readout } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit', physics: true });
      const sky = math.color('#9cc3e6');
      world.scene.background = sky;

      const floor = object.mesh(geometry.box(30, 1, 30), material.meshStandard({ color: '#7f9a6a', roughness: 0.95, physics: 'stone' }));
      floor.position.y = -0.5;
      floor.physics = 'static';
      floor.receiveShadow = true;
      world.scene.add(floor);

      // A pole, and a flag of 30 × 20 squares: each of its vertices is simulated, the column at
      // the pole pinned where it is.
      const wood = material.meshStandard({ color: '#6b4a2e', roughness: 0.8, physics: 'wood' });
      const pole = object.mesh(geometry.cylinder(0.06, 0.06, 5, 16), wood);
      pole.position.set(-4, 2.5, 0);
      pole.physics = 'static';
      const beam = object.mesh(geometry.box(5, 0.12, 0.12), wood);
      beam.position.set(2.5, 4.5, 0);
      beam.physics = 'static';
      // The beam stands on a post at its far end, so the ropes hang from a gallows, not the air.
      // The post stands behind the beam, clear of the ropes that start along it.
      const post = object.mesh(geometry.box(0.14, 4.56, 0.14), wood);
      post.position.set(5, 2.28, -0.13);
      post.physics = 'static';
      world.scene.add(pole, beam, post);

      const COLUMNS = 30, ROWS = 20;
      // The flag is painted once on a canvas: a red field, a cream band along the fly and a navy
      // disc ringed in gold, so its folds read as it waves.
      const banner = document.createElement('canvas');
      banner.width = 384;
      banner.height = 256;
      const paint = banner.getContext('2d');
      paint.fillStyle = '#c23b3b';
      paint.fillRect(0, 0, 384, 256);
      paint.fillStyle = '#f1e6c8';
      paint.fillRect(312, 0, 40, 256);
      paint.beginPath();
      paint.arc(160, 128, 70, 0, Math.PI * 2);
      paint.fillStyle = '#1f3566';
      paint.fill();
      paint.lineWidth = 12;
      paint.strokeStyle = '#e2b13c';
      paint.stroke();
      const cloth = material.meshStandard({ map: texture.canvas(banner), roughness: 0.9, side: 'double' });
      // A plane's vertices run row by row from its bottom left corner: the first of each row is at the pole.
      const atPole = Array.from({ length: ROWS + 1 }, (_, row) => row * (COLUMNS + 1));

      // Ropes: a line's vertices in order, each joined to the next; the first one pinned to the beam.
      const ropeLine = (length, count) => {
        const points = Array.from({ length: count }, (_, i) => [(i * length) / (count - 1), 0, 0]).flat();
        return geometry.createBuffer({ position: buffer.float32(new Float32Array(points), 3) });
      };
      // A pixel-thin line is lost against the sky: the ropes are drawn a few pixels wide.
      const rope = material.line({ color: '#2d2a26', linewidth: 3 });

      let simulated = [];
      const hang = ({ stiff, stretch }) => {
        // The former flag and ropes go, their shapes with them: each hang builds its own.
        for (const mesh of simulated) {
          world.scene.remove(mesh);
          mesh.geometry.dispose();
        }
        const flag = object.mesh(geometry.plane(3, 2, COLUMNS, ROWS), cloth);
        flag.position.set(-4 + 1.5, 3.8, 0);
        flag.physics = { type: 'cloth', pins: atPole, bend: stiff ? 0.001 : Infinity };
        flag.castShadow = true;
        simulated = [flag];
        for (let i = 0; i < 4; i++) {
          const line = object.line(ropeLine(1.5 + i * 0.4, 24), rope);
          line.position.set(0.6 + i * 1.2, 4.38, 0);
          line.physics = { type: 'rope', pins: [0], stretch };
          simulated.push(line);
        }
        world.scene.add(...simulated);
      };

      // A warm afternoon sun low on one side, a blue sky to fill the shade.
      const sun = light.directional({ intensity: 3.4, color: '#ffe0b8', castShadow: true });
      sun.position.set(8, 9, 7);
      world.scene.add(sun, light.hemisphere({ intensity: 1.1, color: '#cfe2ff', groundColor: '#5f6b48' }));
      world.scene.fog = { color: sky, near: 14, far: 30 };
      world.camera.position.set(2, 2.3, 9.6);
      world.controls.target.set(0.5, 2.9, 0);

      const settings = controls(
        {
          stiff: false,
          stretch: [0, 0.05, 0, 0.005],
          again: () => hang(settings),
          slowMotion: false,
        },
        (values, key) => {
          world.physics.timeScale = values.slowMotion ? 0.25 : 1;
          // A soft body's settings are read when it is made: changed, it is hung again.
          if (key === undefined || key === 'stiff' || key === 'stretch') hang(values);
        },
        world,
      );

      const vertices = readout('vertices');
      world.onFrame(() => {
        vertices(String(simulated.reduce((n, mesh) => n + (mesh.physics?.vertices?.length ?? 0) / 3, 0)));
      });
      physicsReadouts(world, ['step']);
    </script>
  </body>
</html>
