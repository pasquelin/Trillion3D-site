<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rough reflections</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #06070a;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, effect, geometry, light, material, math, object } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#06070a');

      // Seven lanes of one floor, from a mirror on the left to the roughest on the right. Under a
      // roughness of about 0.07 the reflection is traced sharp; above, the engine widens the ray
      // into a cone and blurs what it finds, and keeps the last images to smooth it; from 0.6 the
      // screen is no longer traced and only the dim light around is left.
      const put = (mesh, x, y, z) => (mesh.position.set(x, y, z), world.scene.add(mesh), mesh);
      put(object.mesh(geometry.box(16, 0.2, 22), material.meshStandard({ color: '#050506', roughness: 0.95 })), 0, -0.12, 0);
      // At the end of each lane a neon tube of its own colour, and across them all a white globe
      // that drifts from side to side: the same light, seen in seven grades of blur.
      const lane = geometry.box(1.6, 0.04, 16), tube = geometry.cylinder(0.06, 0.06, 3.2, 16);
      const lanes = ['#ff3d6e', '#ff8a3d', '#ffd23d', '#6cff5a', '#3de0ff', '#5a7bff', '#c45aff'].map((colour, k) => {
        put(object.mesh(tube, material.meshStandard({ color: '#000000', emissive: colour, emissiveIntensity: 9 })), (k - 3) * 1.75, 1.7, -8.6);
        return put(object.mesh(lane, material.meshStandard()), (k - 3) * 1.75, 0, -1).material;
      });
      const globe = put(object.mesh(geometry.sphere(0.32, 48, 24), material.meshStandard({ color: '#000000', emissive: '#fff4e6', emissiveIntensity: 14 })), 0, 1.1, -6);
      globe.add(light.point({ color: '#fff4e6', intensity: 10, distance: 9 }));
      world.scene.add(light.hemisphere({ color: '#3a4560', groundColor: '#050506', intensity: 0.15 }));
      world.effects.add(effect.bloom({ intensity: 0.07 }));

      world.camera.position.set(0, 2.4, 8.5);
      world.camera.lookAt(0, 0.6, -4);
      world.controls.target.set(0, 0.6, -4);
      world.controls.minDistance = 4;
      world.controls.maxDistance = 16;
      world.controls.maxPolarAngle = Math.PI / 2 - 0.04;

      // `roughness` is the right-hand lane's; the others step evenly down to a mirror. A metal
      // floor reflects its whole colour, so its blur reads at every angle, not only a grazing one.
      controls({ roughness: [0.1, 1, 0.55, 0.01], metal: false }, (values) => {
        const [metalness, colour] = values.metal ? [1, '#b9bec7'] : [0, '#0d0e12'];
        lanes.forEach((paint, k) => {
          paint.roughness = (k / 6) * values.roughness;
          paint.metalness = metalness;
          paint.color.set(colour);
        });
        world.invalidate();
      }, world);
      let time = 0;
      world.onFrame(({ delta }) => {
        time += Math.min(delta, 0.05);
        globe.position.set(Math.sin(time * 0.35) * 5.5, 1.1 + 0.4 * Math.sin(time * 0.9), -6);
        world.invalidate();
      });
    </script>
  </body>
</html>
