<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Brushed metal</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #161922;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#161922');
      // Steel: a metal (`metalness`) whose roughness spreads every light it mirrors into a soft
      // sheen. The engine declares `anisotropy`, the brushed grain that would draw each light out
      // into a streak, but does not draw it yet: the discs show the roughness alone.
      const steel = material.meshStandard({ color: '#aab4be', metalness: 1, roughness: 0.32 });
      const discs = [];
      const discShape = geometry.cylinder(0.82, 0.82, 0.18, 96);
      for (let column = -2; column <= 2; column++) {
        // Leant back to mirror the softbox overhead, then turned about the vertical.
        const disc = object.mesh(discShape, steel);
        disc.position.set(column * 1.75, 0.72, 0);
        disc.rotation.order = 'YXZ';
        disc.rotation.set(Math.PI / 2 - 0.63, column * 0.22, 0);
        world.scene.add(disc);
        discs.push(disc);
      }
      const bench = object.mesh(
        geometry.box(10, 0.35, 3.2),
        material.meshStandard({ color: '#403329', roughness: 0.88 }),
      );
      bench.position.y = -0.18;
      bench.receiveShadow = true;
      world.scene.add(bench);
      world.scene.add(
        light.directional({
          intensity: 2,
          color: '#fff2db',
          position: [-4, 9, -5],
          castShadow: true,
        }),
      );
      // Two long softboxes, as in a product studio: one over the bench, one low behind it, which
      // draws a bright rim along the discs' edges. A softbox is a rectangle light (`rectArea`)
      // aimed at the bench; a sky and floor fill (`hemisphere`) gives the steel a world to mirror.
      for (const [width, height, position, intensity] of [[9, 0.8, [0, 4.6, 2.6], 4], [9, 0.4, [0, 2.2, -3.2], 5]]) {
        const softbox = light.rectArea({ color: '#f2f5ff', intensity, width, height, position });
        softbox.lookAt(0, 0.9, 0);
        world.scene.add(softbox);
      }
      world.scene.add(light.hemisphere({ color: '#9fb8e0', groundColor: '#5a4030', intensity: 1.2 }));
      world.camera.position.set(0, 2.7, 6.3);
      world.controls.target.set(0, 0.7, 0);

      const ui = controls(
        {
          roughness: [0.05, 0.8, 0.32, 0.01],
          spin: true,
        },
        (values) => {
          steel.roughness = values.roughness;
        },
        world,
      );
      world.onFrame(({ delta }) => {
        if (!ui.spin) return;
        for (const disc of discs) disc.rotation.y += delta * 0.24;
        world.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
