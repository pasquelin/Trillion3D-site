<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A character of points</title>
    <meta name="thumbnail" content="3.5" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070f;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import {
        createWorld,
        animation,
        buffer,
        effect,
        geometry,
        material,
        math,
        object,
      } from '../runtime/engine.js';
      import { controls, seeded } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#05070f');

      // The skeleton: named bones, each a node whose children hang from it. It faces +z, its left
      // on +x; `side` is +1 for the left, -1 for the right.
      const bone = (name, parent, x, y, z = 0) => {
        const node = object.group();
        node.name = name;
        node.position.set(x, y, z);
        parent.add(node);
        return node;
      };
      const dancer = object.group();
      const hips = bone('hips', dancer, 0, 1, 0);
      const spine = bone('spine', hips, 0, 0.2);
      const chest = bone('chest', spine, 0, 0.24);
      const neck = bone('neck', chest, 0, 0.24);
      const head = bone('head', neck, 0, 0.1);
      const limbs = [1, -1].map((side) => {
        const tag = side > 0 ? 'L' : 'R';
        const arm = bone(`arm${tag}`, chest, side * 0.19, 0.17);
        arm.rotation.z = side * 0.22;
        const forearm = bone(`forearm${tag}`, arm, 0, -0.3);
        const hand = bone(`hand${tag}`, forearm, 0, -0.27);
        const thigh = bone(`thigh${tag}`, hips, side * 0.1, -0.06);
        const shin = bone(`shin${tag}`, thigh, 0, -0.44);
        const foot = bone(`foot${tag}`, shin, 0, -0.43);
        return { arm, forearm, hand, thigh, shin, foot };
      });
      const bones = [hips, spine, chest, neck, head, ...limbs.flatMap(Object.values)];
      world.scene.add(dancer);
      // Made now, in the rest pose: the bones' poses now are the bind pose.
      const skeleton = animation.skeleton(bones);
      dancer.updateMatrixWorld(true);
      const rest = bones.map((node) => node.getWorldPosition(math.vector3()));

      // The body's segments, each a tapered capsule from one point to another: `ink` picks its
      // cloud. The points cover their surfaces; each point bends with the two nearest bones.
      const where = (node, x = 0, y = 0, z = 0) =>
        node.localToWorld(math.vector3(x, y, z));
      const segments = [
        [where(hips, 0, -0.06), where(spine, 0, 0.05), 0.15, 0.16, 'body'],
        [where(spine, 0, 0.05), where(chest, 0, 0.16), 0.16, 0.2, 'body'],
        [where(chest, 0, 0.16), where(neck), 0.18, 0.08, 'body'],
        [where(neck), where(head, 0, 0.02), 0.055, 0.06, 'body'],
        [where(head, 0, 0.1), where(head, 0, 0.2), 0.11, 0.1, 'glow'],
        ...limbs.flatMap(({ arm, forearm, hand, thigh, shin, foot }) => [
          [where(arm), where(forearm), 0.065, 0.05, 'body'],
          [where(forearm), where(hand), 0.05, 0.04, 'body'],
          [where(hand, 0, -0.04), where(hand, 0, -0.12), 0.045, 0.03, 'glow'],
          [where(thigh), where(shin), 0.1, 0.07, 'body'],
          [where(shin), where(foot), 0.065, 0.045, 'body'],
          [where(foot, 0, -0.02, -0.03), where(foot, 0, -0.04, 0.16), 0.05, 0.04, 'glow'],
        ]),
      ];
      const area = segments.map(([a, b, r0, r1]) => a.distanceTo(b) * (r0 + r1) + 2 * r0 * r0);
      const total = area.reduce((sum, value) => sum + value, 0);

      /** The two bones nearest `p` and their weights, by inverse distance to each bone's span:
       *  a joint's points share both bones, so the cloud bends smoothly there. */
      const spans = bones.map((node, index) => {
        const child = bones.find((other) => other.parent === node);
        return [rest[index], child ? rest[bones.indexOf(child)] : rest[index]];
      });
      const span = math.vector3(),
        ab = math.vector3();
      function nearestBones(p) {
        // The best two kept as the spans go by: no list made, none sorted, for every point.
        let first = 0,
          second = 0,
          w0 = -1,
          w1 = -1;
        spans.forEach(([a, b], index) => {
          const length = a.distanceToSquared(b);
          ab.copy(b).sub(a);
          const t = length ? math.clamp(span.copy(p).sub(a).dot(ab) / length, 0, 1) : 0;
          span.copy(a).lerp(b, t);
          const w = 1 / (span.distanceToSquared(p) ** 2 + 1e-9);
          if (w > w0) {
            [second, w1, first, w0] = [first, w0, index, w];
          } else if (w > w1) [second, w1] = [index, w];
        });
        return [first, second, w0 / (w0 + w1), w1 / (w0 + w1)];
      }

      const inks = {
        body: material.points({ color: '#6fd6ff', size: 0.016 }),
        glow: material.points({ color: '#ffc27a', size: 0.02 }),
      };
      let clouds = [];
      /** Scatters `count` points over the segments, by area, and skins them to the skeleton. */
      function scatter(count) {
        // The clouds of the last count go, and their point lists with them.
        for (const cloud of clouds) {
          cloud.removeFromParent();
          cloud.geometry.dispose();
        }
        const random = seeded(7);
        const lists = {
          body: { at: [], joints: [], weights: [] },
          glow: { at: [], joints: [], weights: [] },
        };
        const p = math.vector3(),
          axis = math.vector3(),
          across = math.vector3(),
          up = math.vector3();
        segments.forEach(([a, b, r0, r1, ink], index) => {
          const list = lists[ink];
          axis.copy(b).sub(a);
          const length = axis.length();
          axis.normalize();
          across.set(1, 0, 0);
          if (Math.abs(axis.x) > 0.9) across.set(0, 0, 1);
          across.cross(axis).normalize();
          up.copy(axis).cross(across);
          for (let i = Math.round((count * area[index]) / total); i > 0; i--) {
            // Along the span with round ends: a point beyond either end closes the capsule.
            const s = random() * (length + r0 + r1) - r0;
            const t = math.clamp(s / length, 0, 1);
            const radius = r0 + (r1 - r0) * t;
            const beyond = s < 0 ? -s : s > length ? s - length : 0;
            const ring = Math.sqrt(Math.max(0, radius * radius - beyond * beyond));
            const turn = random() * Math.PI * 2;
            p.copy(a)
              .addScaledVector(axis, s)
              .addScaledVector(across, Math.cos(turn) * ring)
              .addScaledVector(up, Math.sin(turn) * ring);
            const [j0, j1, w0, w1] = nearestBones(p);
            list.at.push(p.x, p.y, p.z);
            list.joints.push(j0, j1, 0, 0);
            list.weights.push(w0, w1, 0, 0);
          }
        });
        clouds = Object.entries(lists).map(([ink, { at, joints, weights }]) => {
          const shape = geometry.createBuffer({ position: buffer.float32(at, 3) });
          shape.setAttribute('skinIndex', buffer.uint16(joints, 4));
          shape.setAttribute('skinWeight', buffer.float32(weights, 4));
          const cloud = object.points(shape, inks[ink]);
          cloud.skeleton = skeleton;
          dancer.add(cloud);
          return cloud;
        });
        world.invalidate();
      }

      // The floor: rings of still points, and a far shell of stars.
      const random = seeded(3);
      const floorAt = [];
      for (let ring = 1; ring <= 14; ring++)
        for (let i = 0, n = ring * 36; i < n; i++) {
          const angle = (i / n) * Math.PI * 2 + ring;
          floorAt.push(Math.cos(angle) * ring * 0.22, 0, Math.sin(angle) * ring * 0.22);
        }
      const starAt = [];
      for (let i = 0; i < 1500; i++) {
        const y = random() * 2 - 1,
          turn = random() * Math.PI * 2,
          r = Math.sqrt(1 - y * y) * 40;
        starAt.push(Math.cos(turn) * r, Math.abs(y) * 40 - 4, Math.sin(turn) * r);
      }
      world.scene.add(
        object.points(
          geometry.createBuffer({ position: buffer.float32(floorAt, 3) }),
          material.points({ color: '#25406b', size: 0.012 }),
        ),
        object.points(
          geometry.createBuffer({ position: buffer.float32(starAt, 3) }),
          material.points({ color: '#8fa6d9', size: 0.07 }),
        ),
      );

      // Two bars of dance, keyed every half beat at 120 beats a minute. The arms open outward
      // from the body (`side` turns them), the knees bend as the hips drop on every beat.
      const beat = 0.5;
      const times = Array.from({ length: 9 }, (_, i) => (i * beat) / 2);
      const keys = (path, values) => animation.numberTrack(path, times, values);
      const dance = animation.clip('dance', 2, [
        keys('hips.position.y', [1, 0.93, 1, 0.93, 1, 0.93, 1, 0.93, 1]),
        keys('hips.rotation.y', [0, 0.3, 0.35, 0.1, 0, -0.3, -0.35, -0.1, 0]),
        keys('chest.rotation.y', [0, -0.35, -0.4, -0.12, 0, 0.35, 0.4, 0.12, 0]),
        keys('chest.rotation.z', [0, 0.08, 0, -0.08, 0, 0.08, 0, -0.08, 0]),
        keys('head.rotation.x', [0, 0.18, 0, 0.18, 0, 0.18, 0, 0.18, 0]),
        keys('armR.rotation.z', [-0.22, -0.6, -1.1, -0.7, -0.4, -1.2, -2.5, -1.6, -0.22]),
        keys('armL.rotation.z', [0.22, 1.2, 2.5, 1.6, 0.4, 0.6, 1.1, 0.7, 0.22]),
        keys('forearmL.rotation.x', [-0.3, -1.2, -0.4, -0.9, -0.3, -1, -1.4, -0.8, -0.3]),
        keys('forearmR.rotation.x', [-0.3, -1, -1.4, -0.8, -0.3, -1.2, -0.4, -0.9, -0.3]),
        keys('thighL.rotation.x', [0, -0.45, 0, -0.45, 0, -0.2, -0.6, -0.2, 0]),
        keys('thighR.rotation.x', [0, -0.2, -0.6, -0.2, 0, -0.45, 0, -0.45, 0]),
        keys('shinL.rotation.x', [0, 0.8, 0, 0.8, 0, 0.4, 1.2, 0.4, 0]),
        keys('shinR.rotation.x', [0, 0.4, 1.2, 0.4, 0, 0.8, 0, 0.8, 0]),
        keys('footL.rotation.x', [0, -0.35, 0, -0.35, 0, -0.2, -0.6, -0.2, 0]),
        keys('footR.rotation.x', [0, -0.2, -0.6, -0.2, 0, -0.35, 0, -0.35, 0]),
      ]);
      const action = animation.createMixer(dancer).play(dance);

      world.effects.add(effect.bloom({ intensity: 0.06, radius: 1.4 }));
      world.camera.position.set(1.5, 1.45, 2.6);
      world.controls.target.set(0, 1, 0);
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;
      const ui = controls(
        { points: [2000, 30000, 12000, 1000], speed: [0, 2, 1], spin: true },
        (values, key) => {
          if (key === undefined || key === 'points') scatter(values.points);
          action.timeScale = values.speed;
          world.invalidate();
        },
        world,
      );
      world.onFrame(({ delta }) => {
        if (!ui.spin || !ui.speed) return;
        dancer.rotation.y += Math.min(delta, 0.05) * ui.speed * 0.35;
        world.invalidate();
      });
    </script>
  </body>
</html>
