<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A shape that morphs</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #27324f;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        bottom: 0;
        margin: 0.5rem;
        color: white;
        font: 12px system-ui;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>
      AnimatedMorphCube © 2017 Public —
      <a href="https://creativecommons.org/publicdomain/zero/1.0/">CC0</a>.
    </p>
    <script type="module">
      import {
        createWorld,
        animation,
        effect,
        geometry,
        light,
        material,
        math,
        object,
      } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      const sky = math.color('#27324f');
      world.scene.background = sky;
      // The cube keeps its own pale paint: the light colours it, a warm key on one side and a
      // cool fill on the other, so each face its morph turns reads by its tint.
      const sun = light.directional({ intensity: 3.6, color: '#ffb47a', castShadow: true });
      sun.position.set(5, 6, -2);
      const fill = light.directional({ intensity: 1.6, color: '#7fb0ff' });
      fill.position.set(-5, 3, 4);
      world.scene.add(
        sun,
        fill,
        light.hemisphere({ intensity: 0.6, color: '#cfe0ff', groundColor: '#5a3c2c' }),
      );
      const requested = Number(new URL(location.href).searchParams.get('count') ?? 1);
      const count = [1, 10, 100].includes(requested) ? requested : 1;
      const columns = Math.ceil(Math.sqrt(count));
      const middle = Math.ceil(count / columns) - 1;
      // A stage under the models: a wide disc that takes the sun's shadows, its rim lost in fog.
      const radius = columns * 2 + 6;
      const stage = object.mesh(
        geometry.cylinder(radius, radius, 0.1, 96),
        material.meshStandard({ color: '#7a6a62', roughness: 0.95 }),
      );
      stage.position.set(0, -0.05, middle);
      // It takes shadows and casts none.
      stage.castShadow = false;
      world.scene.add(stage);
      const reach = columns * 2.7 + 3;
      world.scene.fog = { color: sky, near: reach, far: reach + radius };
      world.effects.add(effect.bloom({ intensity: 0.06 }));
      const actions = [];
      for (let i = 0; i < count; i++) {
        const model = await world.scene.load(
          '../assets/examples/animated-morph-cube/cache/native/full/manifest.json',
        );
        // The cube is two units wide about its centre: lifted by one, it rests on the stage.
        model.position.set(((i % columns) - (columns - 1) / 2) * 2, 1, Math.floor(i / columns) * 2);
        const clip = model.animations[0];
        if (!clip) throw new Error('The compiled sample must retain its animation');
        actions.push(
          animation
            .createMixer(model)
            .clipAction(clip)
            .play()
            // Started part way into its loop, the cube opens mid-morph, already leaning.
            .seek(0.4 + i * 0.071),
        );
      }
      world.camera.position.set(columns * 1.9 + 1.1, columns * 1.1 + 1.8, columns * 1.2 + 1.7);
      world.controls.target.set(0, 1, middle);
      controls(
        { playing: true },
        ({ playing }) => {
          for (const action of actions) {
            if (playing) action.play();
            else {
              const time = action.time;
              action.stop().seek(time);
            }
          }
          world.invalidate();
        },
        world,
      );
      // The witness fixes every pose before comparing with this public source.
      // This hook reports inputs only; it does not claim any timing or pixel result.
      globalThis.deformationCase = {
        world,
        count,
        source: '../assets/examples/animated-morph-cube/source/AnimatedMorphCube.glb',
        setTime(seconds) {
          for (const action of actions) action.stop().seek(seconds);
          world.invalidate();
        },
      };
    </script>
  </body>
</html>
