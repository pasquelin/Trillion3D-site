<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Additive poses</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #8fb4d8;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        bottom: 0;
        margin: 0.5rem;
        color: white;
        font: 12px system-ui;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>
      CesiumMan © 2017 Cesium —
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
      <a
        href="https://github.com/KhronosGroup/glTF-Sample-Assets/blob/main/LICENSES/LicenseRef-LegalMark-Cesium.txt"
        >Cesium logo notice</a
      >.
    </p>
    <script type="module">
      import {
        createWorld,
        animation,
        effect,
        geometry,
        light,
        material,
        math,
        object,
      } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      const sky = math.color('#8fb4d8');
      world.scene.background = sky;
      // A stage that takes his shadow, its rim lost in a fog of the sky's colour.
      world.scene.fog = { color: sky, near: 6, far: 13 };
      world.effects.add(effect.bloom({ intensity: 0.06 }));
      const stage = object.mesh(
        geometry.cylinder(8, 8, 0.1, 96),
        material.meshStandard({ color: '#8f7a68', roughness: 0.95 }),
      );
      stage.position.y = -0.05;
      // It takes shadows and casts none.
      stage.castShadow = false;
      // A warm key from the side and a cool sky to fill: the figure reads against both.
      const sun = light.directional({ intensity: 3.4, color: '#ffd9ae', castShadow: true });
      sun.position.set(4, 6, 4);
      world.scene.add(
        stage,
        sun,
        light.hemisphere({ intensity: 1.1, color: '#cfe4ff', groundColor: '#6b4c34' }),
      );

      // The base: the file's walk, played as it is.
      const model = await world.scene.load(
        '../assets/examples/cesium-man/cache/native/full/manifest.json',
      );
      const walk = model.animations[0];
      if (!walk) throw new Error('The compiled sample must retain its animation');
      const mixer = animation.createMixer(model);
      const base = mixer.clipAction(walk).play();

      // The layer: a clip of the spine and the neck alone, keyed by hand. An additive action adds
      // how far each key turns from its first one on top of the walk: a slouch and a sway from
      // side to side the walk never had. Both bones turn about their own axes, `y` across the
      // body (a lean forward), `z` along the way it faces (a roll to the side).
      const turn = (lean, roll) => math.quaternion().setFromEuler(math.euler(0, lean, roll)).toArray();
      const track = ([bone, lean, roll]) => {
        if (!model.getObjectByName(bone)) throw new Error(`The sample must keep the bone ${bone}`);
        const poses = [turn(0, 0), turn(lean, roll), turn(lean, 0), turn(lean, -roll), turn(0, 0)];
        return animation.quaternionTrack(`${bone}.quaternion`, [0, 1, 2, 3, 4], poses.flat());
      };
      const sway = animation.clip('sway', 4, [
        ['Skeleton_torso_joint_2', 0.3, 0.22],
        // The head comes back up a little, so the gaze stays ahead.
        ['Skeleton_neck_joint_1', -0.15, -0.1],
      ].map(track));
      const layer = mixer.clipAction(sway);
      layer.blendMode = 'additive';
      layer.play();

      world.camera.position.set(1.7, 1.3, 1.9);
      world.controls.target.set(0, 0.85, 0);
      // Both actions posed together at their times: one sampled alone would leave the other's
      // bones out, and an additive layer alone adds its sway to the rest pose, not to the walk.
      const pose = () => {
        for (const action of [base, layer]) action.playingNow = true;
        mixer.update(0);
        for (const action of [base, layer]) action.playingNow = false;
        world.invalidate();
      };
      controls(
        { playing: true, weight: [0, 1, 0.8, 0.05] },
        ({ playing, weight }) => {
          // At 0 the walk plays alone; at 1 the whole sway lies on top of it.
          layer.weight = weight;
          if (playing) {
            base.play();
            layer.play();
            world.invalidate();
            return;
          }
          const times = [base.time, layer.time];
          base.stop();
          layer.stop();
          [base.time, layer.time] = times;
          pose();
        },
        world,
      );
      globalThis.deformationCase = {
        world,
        setTime(seconds) {
          base.stop();
          layer.stop();
          base.time = layer.time = seconds;
          pose();
        },
      };
    </script>
  </body>
</html>
