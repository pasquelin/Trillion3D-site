<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Spotlight on crates</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        top: 0;
        margin: 0.5rem;
        color: #cbd5e1;
        font: 12px system-ui;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p data-words="credit"></p>
    <script type="module">
      import { createWorld, light } from '../runtime/engine.js';
      import { controls, pointerOnPlane } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.exposure = 1;
      await world.scene.load('../assets/examples/crates/cache/native/full/manifest.json');
      // One spot light, high above: `outerConeAngle` is the cone's half-angle in radians, `innerConeAngle`
      // the half-angle inside which the light is whole, `radius` the lamp's size, which softens the shadows.
      const spot = light.spot({ position: [0, 6, 2], intensity: 400, intensityUnits: 'candelas', distance: 16, castShadow: true, radius: 0.1 });
      world.scene.add(spot, light.hemisphere({ intensity: 0.9, color: '#8fb4ff', groundColor: '#5a4a3c' }));
      world.camera.position.set(3, 2.3, 4.3);
      world.camera.lookAt(0, 0.6, 0);
      world.controls.target.set(0, 0.6, 0);
      world.controls.maxPolarAngle = Math.PI / 2 - 0.05;

      controls({ angle: [0.1, 0.8, 0.4], softness: [0, 1, 0.4], colour: '#ffe2b8', power: [50, 1200, 400, 10] }, (values) => {
        spot.outerConeAngle = values.angle;
        spot.innerConeAngle = values.angle * (1 - values.softness);
        spot.color.set(values.colour);
        spot.intensity = values.power;
      });

      // The pointer casts a ray from the camera; the lamp hangs 6 m above where it meets the floor
      // (y = 0), still aimed at the crates (its target stays at the origin). A shadow is cast from
      // where the lamp is, not where it points: the lamp moves, so the shadows swing round.
      world.canvas.addEventListener('pointermove', (event) => {
        const floor = pointerOnPlane(world, event);
        if (!floor) return;
        spot.position.set(floor[0], 6, floor[1]);
        world.invalidate();
      });
      world.invalidate();
    </script>
  </body>
</html>
