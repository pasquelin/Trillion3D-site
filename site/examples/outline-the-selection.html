<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Outline the selection</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #18202c;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld } from '../runtime/engine.js';
      import { effect, geometry, light, material, math, object } from '../runtime/engine.js';
      import { controls, onClick } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#18202c');
      const paint = (color) => material.meshStandard({ color, roughness: 0.42, metalness: 0.18 });
      // Three assemblies, each a group of parts that overlap: a click outlines the whole assembly,
      // its subtree, and the line follows only what is seen of it.
      const assembly = (x, z, color) => {
        const group = object.group();
        const base = object.mesh(geometry.box(1.4, 0.3, 1.4), paint('#3a4659'));
        base.position.y = 0.15;
        const core = object.mesh(geometry.sphere(0.5, 32, 20), paint(color));
        core.position.y = 0.85;
        const ring = object.mesh(geometry.torus(0.72, 0.09, 16, 64), paint('#d9dee8'));
        ring.position.y = 0.85;
        ring.rotation.x = Math.PI / 2.6;
        const mast = object.mesh(geometry.cylinder(0.08, 0.08, 1.2, 16), paint('#d9dee8'));
        mast.position.set(0.5, 0.9, -0.5);
        group.add(base, core, ring, mast);
        group.position.set(x, 0, z);
        world.scene.add(group);
        return group;
      };
      const assemblies = [
        assembly(-1.25, 0.35, '#72a7ff'),
        assembly(0.05, -0.65, '#f29b64'),
        assembly(1.2, 0.45, '#77cf94'),
      ];
      const floor = object.mesh(
        geometry.box(7, 0.2, 7),
        material.meshStandard({ color: '#2a3342', roughness: 0.85 }),
      );
      floor.position.y = -0.1;
      floor.receiveShadow = true;
      world.scene.add(
        floor,
        light.directional({
          intensity: 3.4,
          color: '#fff1dc',
          position: [4, 7, 5],
          castShadow: true,
        }),
        light.hemisphere({ intensity: 0.7, color: '#b8d3ff', groundColor: '#202738' }),
      );
      world.camera.position.set(0.8, 3.8, 6.8);
      world.camera.lookAt(0, 0.5, 0);
      world.controls.target.set(0, 0.5, 0);

      const outline = effect.outline({ objects: [assemblies[1]], color: '#ffe36e', thickness: 3 });
      world.effects.add(outline);
      controls(
        { color: '#ffe36e', thickness: [1, 8, 3, 0.5] },
        (values) => {
          outline.color.set(values.color);
          outline.thickness = values.thickness;
        },
      );

      // A click that did not drag the camera outlines the assembly it hit, or nothing.
      onClick(world.canvas, async (event) => {
        const hit = await world.raycast({ x: event.offsetX, y: event.offsetY }, { objects: assemblies });
        outline.objects = hit ? assemblies.filter((group) => hit.object.parent === group) : [];
      });
    </script>
  </body>
</html>
