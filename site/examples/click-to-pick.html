<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Click to pick</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math } from '../runtime/engine.js';
      import { controls, onClick, readout, words } from '../runtime/kit.js';
      const say = words();

      const world = createWorld('view', { controls: 'orbit' });
      world.scene.background = math.color('#171d28');
      world.scene.add(
        light.directional({ color: '#fff1dc', intensity: 3.2, position: [3, 6, 4], castShadow: true }),
        light.hemisphere({ color: '#b8d3ff', groundColor: '#2a2630', intensity: 0.8 }),
      );
      // A dark disc to stand on: not a shape, so the ray is never cast at it.
      const floor = object.mesh(geometry.cylinder(3.6, 3.6, 0.16, 72), material.meshStandard({ color: '#2c3644', roughness: 0.85 }));
      floor.position.y = -0.08;
      floor.castShadow = false;
      world.scene.add(floor);

      // Six shapes in a ring, each with a material of its own: picking one lights only it.
      const shapes = [geometry.box(0.8, 0.8, 0.8), geometry.sphere(0.5, 48, 24), geometry.cone(0.5, 1, 48), geometry.torus(0.4, 0.15, 24, 64), geometry.cylinder(0.4, 0.4, 0.9, 48), geometry.torusKnot(0.3, 0.1, 128, 16)];
      const names = ['box', 'sphere', 'cone', 'torus', 'cylinder', 'knot'];
      const colours = ['#72a7ff', '#f29b64', '#77cf94', '#c58cff', '#f0cf61', '#ef6f86'];
      const pickable = shapes.map((shape, i) => {
        const mesh = object.mesh(shape, material.meshStandard({ color: colours[i], roughness: 0.42, metalness: 0.15, emissiveIntensity: 0.6 }));
        const angle = (i / shapes.length) * Math.PI * 2;
        mesh.position.set(Math.cos(angle) * 2.2, 0.5, Math.sin(angle) * 2.2);
        mesh.name = names[i];
        world.scene.add(mesh);
        return mesh;
      });
      // Close enough that the ring fills the view: six shapes on a wide floor are a small target.
      world.camera.position.set(0, 3.2, 4.8);
      world.camera.lookAt(0, 0, 0);

      controls({});
      const picked = readout('picked'), where = readout('point'), far = readout('distance');

      // A click that did not drag the camera: the ray through the pointer, nearest object first.
      // The point it met is marked, with a short line along the surface's normal there.
      let chosen = null, marks = [];
      onClick(world.canvas, (event) => {
        const hit = world.raycast({ x: event.offsetX, y: event.offsetY }, { objects: pickable });
        chosen?.material.emissive.set('#000000');
        chosen = hit?.object ?? null;
        chosen?.material.emissive.set('#ff9a3c');
        for (const mark of marks) mark.remove();
        marks = [];
        if (hit) {
          const tip = hit.point.clone().addScaledVector(hit.normal, 0.35);
          marks = [
            world.guides.points({ positions: hit.point.toArray(), color: '#ffffff', size: 9 }),
            world.guides.lines({ positions: [...hit.point.toArray(), ...tip.toArray()], color: '#ffffff', width: 2 }),
          ];
        }
        picked(chosen ? say(chosen.name) : say('nothing'));
        where(hit ? hit.point.toArray().map((v) => v.toFixed(2)).join(', ') : '—');
        far(hit ? hit.distance.toFixed(2) : '—');
        world.invalidate();
      });
    </script>
  </body>
</html>
