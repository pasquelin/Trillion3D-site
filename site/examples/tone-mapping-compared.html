<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tone mapping compared</title>
    <meta name="thumbnail" content="2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #120d14;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      // A living room at sunset, 8 m by 8 m and 3.2 m high, its window on the back wall. The sky,
      // the sun and the sunlit floor are tens of times brighter than the corners: more light than
      // a screen shows. The display curve decides how that range is squeezed into it.
      // Every slab is one unit box, stretched: slabs of one paint share a geometry and a material,
      // so the engine draws them together.
      const plaster = material.meshStandard({ color: '#d8cfc4', roughness: 0.9 });
      const unit = geometry.box(1, 1, 1);
      const slab = (width, height, depth, x, y, z, paint = plaster) => {
        const mesh = object.mesh(unit, paint);
        mesh.scale.set(width, height, depth);
        mesh.position.set(x, y, z);
        world.scene.add(mesh);
        return mesh;
      };
      slab(8.4, 0.2, 8.4, 0, -0.1, 0, material.meshStandard({ color: '#7a5236', roughness: 0.55 }));
      slab(8.4, 0.2, 8.4, 0, 3.3, 0);
      slab(0.2, 3.2, 8, -4.1, 1.6, 0);
      slab(0.2, 3.2, 8, 4.1, 1.6, 0);
      slab(8.4, 3.2, 0.2, 0, 1.6, 4.1);
      // The back wall around the window, which spans x −1.8 to 1.2 and y 0.6 to 2.6, and its
      // cross of glazing bars: the wall and the bars are what cut the sunbeam into a shape.
      slab(2.2, 3.2, 0.2, -2.9, 1.6, -4.1);
      slab(2.8, 3.2, 0.2, 2.6, 1.6, -4.1);
      slab(3, 0.6, 0.2, -0.3, 0.3, -4.1);
      slab(3, 0.6, 0.2, -0.3, 2.9, -4.1);
      const bar = material.meshStandard({ color: '#2a2422', roughness: 0.5 });
      slab(0.06, 2, 0.08, -0.3, 1.6, -4.05, bar);
      slab(3, 0.06, 0.08, -0.3, 1.6, -4.05, bar);

      // Outside: sky bands glowing from orange at the horizon to violet above, a dark sea below
      // and the sun's disc on the horizon. They emit, they are lit by nothing, and none of them
      // stands between the sun's light and the room.
      const glow = (colour, strength) => material.meshStandard({ color: '#000000', emissive: colour, emissiveIntensity: strength });
      const sun = object.mesh(geometry.sphere(0.4, 48, 24), glow('#ffd58a', 60));
      sun.position.set(-1.9, 0.75, -9.8);
      world.scene.add(sun);
      const outside = [
        sun,
        slab(16, 0.6, 0.1, -2.5, 0.6, -10, glow('#ff8a3a', 6)),
        slab(16, 0.8, 0.1, -2.5, 1.3, -10, glow('#ff6a58', 3.5)),
        slab(16, 1, 0.1, -2.5, 2.2, -10, glow('#c2508a', 1.8)),
        slab(16, 3, 0.1, -2.5, 4.2, -10, glow('#4a3d86', 0.8)),
        slab(16, 0.1, 5.8, -2.5, 0.25, -7.1, glow('#2a1f3a', 0.4)),
      ];
      for (const mesh of outside) mesh.castShadow = false;

      // The sun itself, low and warm, through the window: a long patch on the floor, many times
      // the room's light. The sky's glow fills the room through the same opening, a soft panel.
      world.scene.add(
        light.directional({ color: '#ffb36b', intensity: 5, position: [-6, 3.2, -14], target: [0.5, 0, 0], castShadow: true }),
        light.hemisphere({ color: '#8a7aa8', groundColor: '#3a2a24', intensity: 0.4 }),
      );
      const skyPanel = light.rectArea({ color: '#ff9a72', intensity: 5, width: 3, height: 2, position: [-0.3, 1.6, -3.95] });
      skyPanel.rotation.set(0, Math.PI, 0);
      world.scene.add(skyPanel);

      // The furniture, in strong colours: under a hard curve a red pot in the sun turns orange,
      // then white; a gentle one keeps it red.
      const fabric = material.meshStandard({ color: '#34456a', roughness: 0.95 });
      slab(1, 0.45, 2.6, -3.4, 0.25, -0.6, fabric);
      slab(0.25, 0.9, 2.6, -3.85, 0.65, -0.6, fabric);
      slab(0.5, 0.4, 0.15, -3.55, 0.65, -1.3, material.meshStandard({ color: '#e0a33a', roughness: 0.9 })).rotation.z = 0.3;
      slab(0.5, 0.4, 0.15, -3.55, 0.65, 0.1, material.meshStandard({ color: '#c2414b', roughness: 0.9 })).rotation.z = 0.3;
      slab(3, 0.02, 2.2, 0, 0.01, -0.8, material.meshStandard({ color: '#1f5f66', roughness: 1 }));
      const walnut = material.meshStandard({ color: '#5a3622', roughness: 0.4 });
      slab(1.4, 0.06, 0.8, 0.6, 0.42, -0.9, walnut);
      for (const [x, z] of [[0.0, -1.2], [1.2, -1.2], [0.0, -0.6], [1.2, -0.6]]) slab(0.05, 0.4, 0.05, x, 0.2, z, walnut);
      const pot = object.mesh(geometry.lathe([[0, 0], [0.12, 0], [0.17, 0.12], [0.14, 0.3], [0.09, 0.38], [0.1, 0.42]], 48), material.meshStandard({ color: '#d4202a', roughness: 0.35 }));
      pot.position.set(0.9, 0.45, -0.9);
      const bowl = object.mesh(geometry.sphere(0.16, 48, 16), material.meshStandard({ color: '#1e5fd8', roughness: 0.3 }));
      bowl.position.set(0.3, 0.52, -0.8);
      bowl.scale.set(1, 0.45, 1);
      world.scene.add(pot, bowl);

      // Two globe lamps, a floor lamp and a table lamp: each globe emits far above white, and a
      // point light of its colour lights the room around it.
      const BULB = 25, LAMP = 6;
      const bulb = glow('#ffcf8a', BULB), globeShape = geometry.sphere(0.17, 32, 16);
      const lamps = [[-2.9, 1.8, 1.6, 1.75], [3.3, 0.95, -3.3, 0.8]].map(([x, y, z, pole]) => {
        slab(0.04, pole, 0.04, x, pole / 2, z, bar);
        const globe = object.mesh(globeShape, bulb);
        globe.position.set(x, y, z);
        globe.castShadow = false;
        const lamp = light.point({ position: [x, y, z], color: '#ffc27a', intensity: LAMP, distance: 7 });
        world.scene.add(globe, lamp);
        return lamp;
      });
      slab(0.6, 0.05, 0.6, 3.3, 0.55, -3.3, walnut);
      slab(0.1, 0.53, 0.1, 3.3, 0.265, -3.3, walnut);

      // The camera stays inside the room, on an arc facing the window; no drag goes through a wall.
      world.camera.position.set(2.4, 1.5, 3);
      world.camera.lookAt(-0.2, 1.3, -1.2);
      world.controls.target.set(-0.2, 1.3, -1.2);
      world.controls.minDistance = 2;
      world.controls.maxDistance = 5.2;
      world.controls.minAzimuthAngle = -0.5;
      world.controls.maxAzimuthAngle = 0.8;
      world.controls.minPolarAngle = 1.25;
      world.controls.maxPolarAngle = Math.PI / 2;
      world.controls.enablePan = false;

      // The curve and the exposure belong to the world: they act on the finished image's light,
      // after every light and material, so the same scene is shown six ways.
      controls({
        toneMapping: ['aces', 'agx', 'neutral', 'reinhard', 'cineon', 'linear'],
        exposure: [0.2, 4, 1],
        lamps: true,
      }, (values, key) => {
        if (key === undefined || key === 'toneMapping') world.toneMapping = values.toneMapping;
        if (key === undefined || key === 'exposure') world.exposure = values.exposure;
        if (key !== 'lamps') return;
        bulb.emissiveIntensity = values.lamps ? BULB : 0;
        for (const lamp of lamps) lamp.intensity = values.lamps ? LAMP : 0;
        world.invalidate();
      }, world);
    </script>
  </body>
</html>
