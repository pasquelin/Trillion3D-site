<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Wave of cubes</title>
    <meta name="thumbnail" content="3.2" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #171d28;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <script type="module">
      import { createWorld, geometry, material, object, light, math, effect } from '../runtime/engine.js';
      import { controls, pointerOnPlane } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });

      // One box shape shared by every cube, and a palette of twelve materials from the centre
      // outwards: the engine groups what shares a shape and a material into one draw.
      const SIDE = 48, GAP = 0.36;
      const cube = geometry.box(GAP, 1, GAP);
      const palette = Array.from({ length: 12 }, () => material.meshStandard({ roughness: 0.35, metalness: 0.2 }));
      const cubes = [];
      for (let row = 0; row < SIDE; row++)
        for (let column = 0; column < SIDE; column++) {
          const x = (column - SIDE / 2 + 0.5) * GAP, z = (row - SIDE / 2 + 0.5) * GAP;
          const band = Math.min(11, Math.floor((Math.hypot(x, z) / (SIDE * GAP * 0.72)) * 12));
          const mesh = object.mesh(cube, palette[band]);
          mesh.position.set(x, 0, z);
          world.scene.add(mesh);
          cubes.push(mesh);
        }
      // A dark glossy floor under the grid takes the cubes' shadows and the sun's sheen, and a
      // soft glow spreads round the brightest faces.
      const ground = object.mesh(geometry.box(SIDE * GAP + 6, 0.2, SIDE * GAP + 6), material.meshStandard({ color: '#10141c', roughness: 0.18, metalness: 0.4 }));
      ground.position.y = -0.1;
      world.scene.add(ground);
      world.effects.add(effect.bloom({ intensity: 0.06 }));
      world.scene.add(light.directional({ intensity: 2.5, color: '#fff3e6', position: [8, 12, 6], castShadow: true }));
      world.scene.add(light.directional({ intensity: 0.5, color: '#7aa2ff', position: [-8, 5, -6] }));
      world.camera.position.set(3, 10, 15);
      world.camera.lookAt(0, 0, 0);
      world.controls.target.set(0, 0, 0);

      // The palette runs from one colour to the other, through linear light; its materials are
      // written only when a colour changes.
      let stone = [0, 0], time = 0, resting = false;
      const ui = controls({ height: [0, 3, 1.4], speed: [0, 3, 1], ripples: [1, 8, 3, 1], inner: '#ff4f7b', outer: '#2fd4ff' }, (values, key) => {
        resting = false;
        if (key === undefined || key === 'inner' || key === 'outer') {
          const from = math.color(values.inner), to = math.color(values.outer);
          palette.forEach((matter, band) => matter.color.copy(from).lerp(to, band / 11));
        }
        world.invalidate();
      }, world);

      // Each cube's distance to the last stone dropped, measured again only when a stone falls.
      const distances = new Float32Array(cubes.length);
      const measure = () => cubes.forEach((mesh, k) => (distances[k] = Math.hypot(mesh.position.x - stone[0], mesh.position.z - stone[1])));
      measure();

      // Every frame each cube's height reads its distance to the stone. At speed zero the grid is
      // shaped once more after a change, then asks for no new frame.
      world.onFrame(({ delta }) => {
        if (resting) return;
        resting = !ui.speed;
        time += delta * ui.speed;
        for (let k = 0; k < cubes.length; k++) {
          const mesh = cubes[k], distance = distances[k];
          const wave = Math.sin(distance * ui.ripples - time * 4) * Math.exp(-distance * 0.12);
          mesh.scale.y = 0.2 + ui.height * (1 + wave);
          mesh.position.y = mesh.scale.y / 2;
        }
        world.invalidate();
      });

      // A double-click is a ray from the camera through the pointer, stopped by the floor (y = 0).
      world.canvas.addEventListener('dblclick', (event) => {
        const floor = pointerOnPlane(world, event);
        if (!floor) return;
        stone = floor;
        measure();
        time = 0;
        resting = false;
        world.invalidate();
      });
    </script>
  </body>
</html>
