<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Pick lines and points</title>
    <meta name="thumbnail" content="4" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #04050c;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      /* The pointer the page moves on its own until the viewer's own comes over the canvas. */
      #ghost {
        position: absolute;
        width: 22px;
        height: 22px;
        pointer-events: none;
        filter: drop-shadow(0 0 4px #8fc4ff);
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <svg id="ghost" viewBox="0 0 22 22"><path d="M2 2 L2 18 L6.5 13.8 L9.6 20.5 L12.6 19.2 L9.6 12.6 L15.6 12.6 Z" fill="#ffffff" stroke="#0b1020" stroke-width="1.4" stroke-linejoin="round" /></svg>
    <script type="module">
      import { buffer, createWorld, effect, geometry, light, material, math, object, texture } from '../runtime/engine.js';
      import { canvasRay, controls, ease, language, latestOnly, mix, readout, seeded, words } from '../runtime/kit.js';

      const say = words();
      const world = createWorld('view', { controls: 'orbit' });
      world.exposure = 1;
      world.scene.background = math.color('#04050c');
      world.camera.position.set(3.3, 4.2, 13.2);
      world.camera.lookAt(0, 0, 0);
      world.controls.target.set(0, 0, 0);
      world.controls.minDistance = 6;
      world.controls.maxDistance = 22;

      // A celestial globe: stars on a shell of radius 4 over a dark inner ball, their figures
      // joined by lines, and the grid of parallels and meridians. The whole sky turns in `sky`.
      const R = 4;
      const sky = object.group();
      sky.rotation.set(0.38, 0, -0.2);
      world.scene.add(sky);
      const spin = object.group();
      sky.add(spin);
      const ball = object.mesh(geometry.sphere(R * 0.975, 96, 48), material.meshStandard({ color: '#0a1230', roughness: 0.75, metalness: 0.1 }));
      spin.add(ball);

      // The stars: seeded, evenly spread over the shell, in four classes of size and colour. A
      // points object draws one colour at one size, so each class is one object of its own.
      const next = seeded(7);
      const onShell = () => {
        const y = next() * 2 - 1, around = next() * Math.PI * 2, ring = Math.sqrt(1 - y * y);
        return [ring * Math.cos(around) * R, y * R, ring * Math.sin(around) * R];
      };
      const CLASSES = [
        { colour: '#fff3d6', size: 0.075, count: 90 },
        { colour: '#cfe2ff', size: 0.05, count: 420 },
        { colour: '#ffc48a', size: 0.045, count: 260 },
        { colour: '#7f97d6', size: 0.03, count: 2400 },
      ];
      const stars = [], clouds = [];
      for (const [rank, { colour, size, count }] of CLASSES.entries()) {
        const at = new Float32Array(count * 3), ofClass = [];
        for (let k = 0; k < count; k++) {
          const p = onShell(), star = { p, rank, index: stars.length };
          at.set(p, k * 3);
          stars.push(star);
          ofClass.push(star);
        }
        const cloud = object.points(geometry.createBuffer({ position: buffer.float32(at, 3) }), material.points({ color: colour, size }));
        spin.add(cloud);
        clouds.push({ cloud, stars: ofClass });
      }
      const angle = (a, b) => Math.acos(math.clamp((a[0] * b[0] + a[1] * b[1] + a[2] * b[2]) / (R * R), -1, 1));

      // A lane is a line object drawn in its own ink from `segments`, the pairs of ends of its
      // segments, with the name `label` gives it and its ink at rest.
      function lane(segments, label, rest, width) {
        const ink = material.line({ color: rest, linewidth: width });
        const line = object.lineSegments(geometry.createBuffer({ position: buffer.float32(new Float32Array(segments.flat()), 3) }), ink);
        spin.add(line);
        return { line, ink, segments, label, rest, width };
      }

      // The figures: around fourteen bright stars far apart, the nearest bright and middle
      // stars, joined by their shortest tree (Prim's), as a constellation joins its stars.
      const anchors = [];
      for (const star of stars) if (star.rank === 0 && anchors.length < 14 && anchors.every((a) => angle(a.p, star.p) > 0.62)) anchors.push(star);
      const figures = anchors.map((anchor, index) => {
        const near = stars.filter((s) => s.rank < 2 && angle(s.p, anchor.p) < 0.36).sort((a, b) => angle(a.p, anchor.p) - angle(b.p, anchor.p)).slice(0, 8);
        const inTree = [near[0]], pairs = [];
        while (inTree.length < near.length) {
          let best = null;
          for (const a of inTree) for (const b of near) if (!inTree.includes(b) && (!best || angle(a.p, b.p) < best[2])) best = [a, b, angle(a.p, b.p)];
          inTree.push(best[1]);
          pairs.push(best[0].p, best[1].p);
        }
        return lane(pairs, () => say('figure', { n: index + 1 }), '#6fa8ff', 1.6);
      });

      // The grid, a little above the stars' shell so it never hides in the ball: parallels every
      // 30° and twelve meridians, each a loop of its own.
      const LOOP = 120, SHELL = R * 1.004;
      const loop = (place) => {
        const pairs = [];
        for (let k = 0; k < LOOP; k++) pairs.push(place(k / LOOP), place((k + 1) / LOOP));
        return pairs;
      };
      const grid = [];
      for (const lat of [-60, -30, 0, 30, 60]) {
        const phi = (lat * Math.PI) / 180, r = Math.cos(phi) * SHELL, y = Math.sin(phi) * SHELL;
        grid.push(lane(loop((t) => [Math.cos(t * Math.PI * 2) * r, y, Math.sin(t * Math.PI * 2) * r]), () => say('parallel', { deg: lat }), '#26365f', 1));
      }
      for (let k = 0; k < 6; k++) {
        const theta = (k / 6) * Math.PI;
        const place = (t) => {
          const a = t * Math.PI * 2;
          return [Math.cos(a) * Math.cos(theta) * SHELL, Math.sin(a) * SHELL, Math.cos(a) * Math.sin(theta) * SHELL];
        };
        grid.push(lane(loop(place), () => say('meridian', { deg: k * 30 }), '#26365f', 1));
      }
      const lanes = [...figures, ...grid];

      // The armillary rings round the globe: brass, lit, only there to frame it.
      const brass = material.meshStandard({ color: '#c9973f', roughness: 0.28, metalness: 0.95 });
      const equator = object.mesh(geometry.torus(R * 1.16, 0.05, 16, 160), brass);
      equator.rotation.x = Math.PI / 2;
      const meridian = object.mesh(geometry.torus(R * 1.22, 0.06, 16, 160), brass);
      sky.add(equator, meridian);
      world.scene.add(
        light.directional({ intensity: 2.4, color: '#fff0d8', position: [6, 8, 7] }),
        light.hemisphere({ intensity: 0.5, color: '#7d95d8', groundColor: '#1a1206' }),
      );
      world.effects.add(effect.bloom({ intensity: 0.12, sizeScale: 3.6 }));

      // What the pointer marks: a ring that keeps its size on screen, on the star picked or on
      // the nearest point of the line picked, and the segment picked drawn wide in gold.
      const sheet = document.createElement('canvas');
      sheet.width = sheet.height = 128;
      const pen = sheet.getContext('2d');
      pen.strokeStyle = '#ffffff';
      pen.lineWidth = 9;
      pen.beginPath();
      pen.arc(64, 64, 50, 0, Math.PI * 2);
      for (const [x, y] of [[64, 0], [64, 128], [0, 64], [128, 64]]) {
        pen.moveTo(x, y);
        pen.lineTo(64 + (x - 64) * 0.62, 64 + (y - 64) * 0.62);
      }
      pen.stroke();
      const reticle = object.sprite(material.sprite({ map: texture.canvas(sheet), color: '#ffe08a', depthTest: false }));
      reticle.visible = false;
      spin.add(reticle);
      const goldInk = material.line({ color: '#ffd166', linewidth: 5 });
      let picked = null;

      // ---- The picking. One `world.raycast` among the ball, the stars and the lines answers the
      // nearest of them under the pointer: a star is met on its dot, as wide as its size, a line
      // where the ray passes within `reach` world units of it, and the ball hides what lies behind
      // it. The answer names the object and the point met on the ray; which star of a cloud, or
      // which segment of a line, is read from that point in the sky's own frame.
      const starObjects = clouds.map((c) => c.cloud), lineObjects = lanes.map((lane) => lane.line);
      const box = () => world.canvas.getBoundingClientRect();
      // The angle one pixel makes at the eye in the middle of the picture: the gap between the
      // rays through two neighbouring pixels.
      function pixelAngle() {
        const size = box(), x = size.width / 2, y = size.height / 2;
        const ray = canvasRay(world, x, y, size), below = canvasRay(world, x, y + 1, size);
        return ray ? Math.hypot(ray.direction.x - below.direction.x, ray.direction.y - below.direction.y, ray.direction.z - below.direction.z) : 0;
      }
      const gap = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
      // The segment of a line nearest the point `p`, and the point of it that is.
      function nearestSegment({ segments }, p) {
        let best = null;
        for (let k = 0; k < segments.length; k += 2) {
          const [a, b] = [segments[k], segments[k + 1]];
          const run = [b[0] - a[0], b[1] - a[1], b[2] - a[2]];
          const t = math.clamp(((p[0] - a[0]) * run[0] + (p[1] - a[1]) * run[1] + (p[2] - a[2]) * run[2]) / (run[0] ** 2 + run[1] ** 2 + run[2] ** 2), 0, 1);
          const at = [a[0] + run[0] * t, a[1] + run[1] * t, a[2] + run[2] * t], off = gap(at, p);
          if (!best || off < best.off) best = { off, at, segment: [a, b], index: k / 2 };
        }
        return best;
      }
      // What the engine's hit is, the point met taken into the sky's frame (`toLocal`): the star
      // of the cloud nearest to it, or the segment of the line nearest to it. The ball is nothing.
      function read(hit, toLocal) {
        if (!hit) return null;
        const p = hit.point.clone().applyMatrix4(toLocal).toArray();
        const cloud = clouds.find((c) => c.cloud === hit.object);
        if (cloud) {
          const star = cloud.stars.reduce((best, s) => (gap(s.p, p) < gap(best.p, p) ? s : best));
          return { kind: 'star', star, off: gap(star.p, p), at: star.p };
        }
        const owner = lanes.find((lane) => lane.line === hit.object);
        return owner ? { kind: 'line', owner, ...nearestSegment(owner, p) } : null;
      }

      // ---- What a pick changes: the line it names brightens, its segment glows, the ring moves.
      let lit = null, segmentLine = null, pointer = null, ghostTime = 0, own = false;
      function show(result) {
        const hit = result.hit;
        const owner = hit?.kind === 'line' ? hit.owner : null;
        if (lit !== owner) {
          if (lit) {
            lit.ink.color.set(lit.rest);
            lit.ink.linewidth = lit.width;
          }
          if (owner) {
            owner.ink.color.set('#b8dcff');
            owner.ink.linewidth = 2.6;
          }
          lit = owner;
        }
        const segment = hit?.kind === 'line' ? hit.segment : null;
        if (segmentLine && segmentLine.userData.segment !== segment) {
          spin.remove(segmentLine);
          segmentLine.geometry.dispose();
          segmentLine = null;
        }
        // A line's positions are cut into what it draws once: a new segment is a new line.
        if (segment && !segmentLine) {
          segmentLine = object.lineSegments(geometry.createBuffer({ position: buffer.float32(new Float32Array([...segment[0], ...segment[1]]), 3) }), goldInk);
          segmentLine.userData.segment = segment;
          // Lifted a hair off the figure's own line, so the two never fight for the same depth.
          segmentLine.scale.setScalar(1.003);
          spin.add(segmentLine);
        }
        reticle.visible = Boolean(hit);
        if (hit) reticle.position.set(...hit.at);
        reticle.material.color.set(hit?.kind === 'line' ? '#ffd166' : '#ffffff');
        picked = hit;
        const n = (value, digits = 0) => value.toLocaleString(language(), { maximumFractionDigits: digits, minimumFractionDigits: digits });
        if (!hit) {
          shownHit(say('nothing'));
          shownPlace('—');
          shownOff('—');
        } else if (hit.kind === 'star') {
          const [x, y, z] = hit.star.p;
          shownHit(say('star', { n: n(hit.star.index + 1), total: n(stars.length) }));
          shownPlace(say('place', { lon: n(((Math.atan2(z, x) * 180) / Math.PI + 360) % 360, 1), lat: n((Math.asin(y / R) * 180) / Math.PI, 1) }));
          shownOff(n(hit.off, 3));
        } else {
          shownHit(hit.owner.label());
          shownPlace(say('segment', { k: n(hit.index + 1), total: n(hit.owner.segments.length / 2) }));
          shownOff(n(hit.off, 3));
        }
        shownCost(say('cost', { ms: n(result.time, 1) }));
        world.invalidate();
      }

      // `aimed`: the pointer moved since the last frame, which picks again, once.
      let aimed = false;
      const ui = controls({ reach: [0.02, 0.6, 0.15, 0.01], stars: true, lines: true, turning: true }, (values, key) => {
        if (key) aimed = true;
        world.invalidate();
      });
      const shownHit = readout('hit'), shownPlace = readout('place'), shownOff = readout('off'), shownCost = readout('cost');

      // ---- The pointer: the viewer's, or until it comes, a ghost that wanders over the globe.
      const ghost = document.getElementById('ghost');
      const aim = (event) => {
        own = true;
        ghost.style.display = 'none';
        pointer = [event.offsetX, event.offsetY];
        aimed = true;
        world.invalidate();
      };
      world.canvas.addEventListener('pointermove', aim);
      world.canvas.addEventListener('pointerdown', aim);
      world.canvas.addEventListener('pointerleave', () => {
        if (!own) return;
        pointer = null;
        show({ hit: null, time: 0 });
      });

      // The ghost goes from target to target on the side of the globe facing the eye — a star,
      // then the middle of a figure's segment, in turn — gliding 1.1 s and resting 1.3 s on each.
      // A target is a point of the sky put on the screen: the sky's matrix, the camera's inverse,
      // then the perspective divide.
      const seen = math.vector3();
      function onScreen(p) {
        seen.set(...p).applyMatrix4(spin.matrixWorld).applyMatrix4(world.camera.matrixWorldInverse);
        if (seen.z > -0.1) return null;
        const { width, height } = box(), slope = Math.tan((world.camera.fov * Math.PI) / 360);
        const x = seen.x / -seen.z / (slope * (width / height)), y = seen.y / -seen.z / slope;
        return [((x + 1) / 2) * width, ((1 - y) / 2) * height];
      }
      function facing(p) {
        seen.set(...p).applyMatrix4(spin.matrixWorld);
        const c = world.camera.position;
        return (seen.x * (c.x - seen.x) + seen.y * (c.y - seen.y) + seen.z * (c.z - seen.z)) / R;
      }
      const legs = [];
      function target(k) {
        const pool = k % 2
          ? figures.flatMap((f) => f.segments.filter((_, i) => i % 2 === 0).map((a, i) => a.map((v, axis) => (v + f.segments[i * 2 + 1][axis]) / 2)))
          : stars.filter((star) => star.rank < 2).map((star) => star.p);
        const middle = box().width / 2;
        const ranked = pool.map((p) => [p, facing(p) - Math.abs((onScreen(p)?.[0] ?? 0) - middle) * 0.004]).sort((x, y) => y[1] - x[1]);
        return ranked[Math.floor(next() * Math.min(6, ranked.length))][0];
      }
      function ghostAt(time) {
        const leg = Math.floor(time / 2.4), within = time - leg * 2.4;
        while (legs.length <= leg + 1) legs.push(target(legs.length));
        spin.updateWorldMatrix(true, false);
        const { width, height } = box();
        const from = leg ? onScreen(legs[leg - 1]) ?? [width / 2, height / 2] : [width * 0.5, height * 0.62];
        const to = onScreen(legs[leg]) ?? from;
        return mix({ math }, from, to, ease.smooth(within / 1.1));
      }

      // One pick in flight at the last pointer position; an answer that lands once the pointer
      // left shows nothing. The sky's frame is the one the ray is cast in, as the sky turns on
      // while the answer comes; the time is the answer's, a frame or so after the ask.
      const aimPick = latestOnly(
        async ([x, y]) => {
          const toLocal = spin.matrixWorld.clone().invert(), asked = performance.now();
          const objects = [ball, ...(ui.stars ? starObjects : []), ...(ui.lines ? lineObjects : [])];
          const hit = await world.raycast({ x, y }, { objects, lineThreshold: ui.reach });
          return { hit: read(hit, toLocal), time: performance.now() - asked };
        },
        (result) => pointer && show(result),
      );

      // The ring keeps 34 pixels across wherever it stands: its world size is the distance times
      // the angle of a pixel. The sky turns slowly; the pointer, still, picks again as it turns.
      const where = math.vector3();
      world.onFrame(({ delta }) => {
        const step = Math.min(delta, 0.05);
        if (ui.turning) spin.rotation.y += step * 0.06;
        if (!own) {
          ghostTime += step;
          pointer = ghostAt(ghostTime);
          ghost.style.left = `${pointer[0] - 2}px`;
          ghost.style.top = `${pointer[1] - 2}px`;
        }
        if (pointer && (aimed || ui.turning || !own)) aimPick(pointer);
        aimed = false;
        if (picked) {
          reticle.updateWorldMatrix(true, false);
          where.setFromMatrixPosition(reticle.matrixWorld);
          reticle.scale.setScalar(world.camera.position.distanceTo(where) * pixelAngle() * 34);
        }
        // A still sky under a still pointer draws nothing new: the page then waits for the viewer.
        if (ui.turning || !own) world.invalidate();
      });
    </script>
  </body>
</html>
