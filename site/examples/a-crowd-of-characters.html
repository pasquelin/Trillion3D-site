<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A crowd of characters</title>
    <meta name="thumbnail" content="3" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #e9b98f;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      p {
        position: absolute;
        bottom: 0;
        margin: 0.5rem;
        color: white;
        font: 12px system-ui;
      }
      a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <p>
      CesiumMan © 2017 Cesium —
      <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a>.
      <a
        href="https://github.com/KhronosGroup/glTF-Sample-Assets/blob/main/LICENSES/LicenseRef-LegalMark-Cesium.txt"
        >Cesium logo notice</a
      >.
    </p>
    <script type="module">
      import {
        createWorld,
        animation,
        effect,
        geometry,
        light,
        material,
        math,
        object,
      } from '../runtime/engine.js';
      import { controls } from '../runtime/kit.js';

      const world = createWorld('view', { controls: 'orbit' });
      // A late-afternoon light: a low warm sun that draws long shadows, a cool sky to fill them.
      const sky = math.color('#e9b98f');
      world.scene.background = sky;
      const sun = light.directional({ intensity: 3.4, color: '#ffd7a8', castShadow: true });
      sun.position.set(-6, 5, 3);
      world.scene.add(
        sun,
        light.hemisphere({ intensity: 1.2, color: '#bcd4ff', groundColor: '#6b4a3a' }),
      );
      const requested = Number(new URL(location.href).searchParams.get('count') ?? 10);
      const count = [1, 10, 100].includes(requested) ? requested : 10;
      const columns = Math.ceil(Math.sqrt(count));
      const middle = (Math.ceil(count / columns) - 1) / 2;
      // A stage under the crowd: a wide disc that takes the sun's shadows, its rim lost in fog.
      const radius = columns * 2 + 8;
      const stage = object.mesh(
        geometry.cylinder(radius, radius, 0.1, 96),
        material.meshStandard({ color: '#8a6450', roughness: 0.95 }),
      );
      stage.position.set(0, -0.05, middle);
      // It takes shadows and casts none.
      stage.castShadow = false;
      world.scene.add(stage);
      const reach = columns * 2.5 + 3;
      world.scene.fog = { color: sky, near: reach, far: reach + radius };
      world.effects.add(effect.bloom({ intensity: 0.05 }));
      // Every character is asked for at once rather than one after the other: their downloads and
      // reads overlap instead of queueing.
      const models = await Promise.all(
        Array.from({ length: count }, () => world.scene.load('../assets/examples/cesium-man/cache/native/full/manifest.json')),
      );
      const actions = models.map((model, i) => {
        model.position.set(((i % columns) - (columns - 1) / 2) * 2, 0, Math.floor(i / columns) * 2);
        const clip = model.animations[0];
        if (!clip) throw new Error('The compiled sample must retain its animation');
        return animation
          .createMixer(model)
          .clipAction(clip)
          .play()
          .seek(i * 0.071);
      });
      world.camera.position.set(columns * 0.8, columns * 0.6 + 1.4, middle + columns * 1.3 + 1.5);
      world.controls.target.set(0, 0.8, middle);
      controls(
        { playing: true },
        ({ playing }) => {
          for (const action of actions) {
            if (playing) action.play();
            else {
              const time = action.time;
              action.stop().seek(time);
            }
          }
          world.invalidate();
        },
        world,
      );
      // The witness fixes every pose before comparing with this public source.
      // This hook reports inputs only; it does not claim any timing or pixel result.
      globalThis.deformationCase = {
        world,
        count,
        source: '../assets/examples/cesium-man/source/CesiumMan.glb',
        setTime(seconds) {
          for (const action of actions) action.stop().seek(seconds);
          world.invalidate();
        },
      };
    </script>
  </body>
</html>
